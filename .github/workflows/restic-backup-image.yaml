name: restic-backup-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - containers/restic-backup/**
      - .github/workflows/restic-backup-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: containers/restic-backup
          file: containers/restic-backup/Containerfile
          push: true
          tags: ghcr.io/sandersch/restic-backup:0.19.0-1
