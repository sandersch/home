name: restic-backup-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - containers/restic-backup/**
      - .github/workflows/restic-backup-image.yaml

permissions:
  contents: read

jobs:
  # Human changes stay attended: build without publishing, then dispatch by hand.
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate release metadata
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version="$(<containers/restic-backup/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]
          grep -Eq '^FROM restic/restic:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$' \
            containers/restic-backup/Containerfile
          if [[ -n "$PR_BASE_SHA" ]] && \
             ! git diff --quiet "$PR_BASE_SHA" -- containers/restic-backup/Containerfile && \
             git diff --quiet "$PR_BASE_SHA" -- containers/restic-backup/VERSION; then
            echo 'Containerfile changed without a VERSION revision bump' >&2
            exit 1
          fi

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: containers/restic-backup
          file: containers/restic-backup/Containerfile
          push: false

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a release tag
        id: release
        run: |
          version="$(<containers/restic-backup/VERSION)"
          image="ghcr.io/sandersch/restic-backup:$version"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image $image" >&2
            exit 1
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers/restic-backup
          file: containers/restic-backup/Containerfile
          push: true
          tags: ${{ steps.release.outputs.image }}

      - name: Record immutable release for the reviewed branch
        run: |
          {
            echo '### Restic backup image published'
            echo
            echo 'Pin every CronJob and recovery helper on this branch before merge:'
            echo
            echo '```text'
            echo 'runbooks/version-management/restic-release.py pin ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # Renovate only moves the restic/restic base, so its PRs are released
  # automatically: bump VERSION, publish a fresh tag, pin every reference, and
  # push the result back to the PR branch. Nothing reaches the cluster until the
  # PR is merged. Renovate ignores these commits (gitIgnoredAuthors) and redoes
  # its own commit when it rebases, which reruns this job on a new tag.
  renovate-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: write
      contents: write
      packages: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Select release version
        id: version
        run: |
          # A no-op when this branch already carries a release for the current
          # Containerfile, e.g. when a run is re-approved or re-run.
          base="$(git merge-base "$BASE_SHA" HEAD)"
          runbooks/version-management/restic-release.py version --base "$base"
          if git diff --quiet -- containers/restic-backup/VERSION; then
            echo 'Already released for this Containerfile; nothing to do'
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip tags that already exist
        if: steps.version.outputs.release == 'true'
        id: release
        run: |
          # An earlier run for this PR may have published before a rebase; never
          # overwrite it, take the next revision instead.
          version="$(<containers/restic-backup/VERSION)"
          while docker manifest inspect "ghcr.io/sandersch/restic-backup:$version" >/dev/null 2>&1; do
            version="$(runbooks/version-management/restic-release.py next-revision)"
          done
          echo "image=ghcr.io/sandersch/restic-backup:$version" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.version.outputs.release == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers/restic-backup
          file: containers/restic-backup/Containerfile
          push: true
          tags: ${{ steps.release.outputs.image }}

      - name: Pin the release and push it to the PR branch
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          runbooks/version-management/restic-release.py pin "$IMAGE"
          runbooks/version-management/image_policy.py check --quiet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -am "Release ${IMAGE%@*}" -m "Pinned as $IMAGE by the restic-backup-image workflow."
          # Fast-forward only: if Renovate pushed meanwhile, its push starts a new run.
          git push origin "HEAD:refs/heads/$HEAD_REF"
          # GITHUB_TOKEN pushes do not trigger pull_request workflows, so start
          # the image-policy checks on the new head explicitly.
          gh workflow run image-policy.yaml --ref "$HEAD_REF" -f base_sha="$BASE_SHA"
          {
            echo '### Restic backup image released'
            echo
            echo "Pinned \`$IMAGE\` on \`$HEAD_REF\`; image-policy was dispatched for the new head."
          } >>"$GITHUB_STEP_SUMMARY"
