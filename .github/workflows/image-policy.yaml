name: image-policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install backup test tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-tools"
          "$RUNNER_TEMP/backup-tools/bin/pip" install --quiet 'yq==3.4.3'
          echo "$RUNNER_TEMP/backup-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/backup-tools/bin/yq" --version

      - name: Validate immutable image inventory
        run: |
          runbooks/version-management/test-image-policy.sh
          runbooks/version-management/image_policy.py check
          runbooks/phase2/test-k3s-version.sh
          runbooks/phase2/test-k3s-upgrade.sh
          runbooks/backups/test-mount-guard.sh
          runbooks/backups/test-contracts.sh
          runbooks/backups/test-config-scripts.sh
          runbooks/backups/test-phase4-b2.sh
          runbooks/backups/test-review-regressions.sh

      - name: Test vault prune alerts
        env:
          PROMTOOL: >-
            docker run --rm --network none -v /tmp:/tmp:ro
            --tmpfs /work -e TMPDIR=/work --entrypoint /bin/promtool
            quay.io/prometheus/prometheus:v3.13.1-distroless@sha256:214f8427c8fba80c327bb94a75feb802ae12f2d6ca30812aa6e7d22f09bbea80
        run: |
          python3 runbooks/backups/test-prune-alerts.py
          python3 runbooks/backups/test-workstation-alerts.py

      - name: Test workstation repositories and append-only server
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 runbooks/backups/workstation-install-restic.py --directory "$RUNNER_TEMP/restic"
          export WORKSTATION_RESTIC="$RUNNER_TEMP/restic/restic"
          python3 runbooks/backups/test-workstations.py
          bash runbooks/backups/test-workstation-rest-server.sh

      - name: Check changed shell scripts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE_SHA:-HEAD^}"
          mapfile -t scripts < <(git diff --name-only --diff-filter=ACMRT "$base" -- '*.sh')
          if ((${#scripts[@]})); then
            bash -n "${scripts[@]}"
            shellcheck --severity=warning "${scripts[@]}"
          fi

      - name: Render application manifests
        uses: imranismail/setup-kustomize@v2
      - run: kustomize build apps >/dev/null
      - run: kustomize build infrastructure/monitoring >/dev/null
      - run: kustomize build infrastructure/monitoring/workstations >/dev/null
