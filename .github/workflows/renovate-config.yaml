name: renovate-config

# The validator result depends only on renovate.json5 and the Renovate version
# pinned below, so skip the ~30s install when neither changes.
on:
  pull_request:
    paths:
      - renovate.json5
      - .github/workflows/renovate-config.yaml
  push:
    branches:
      - main
    paths:
      - renovate.json5
      - .github/workflows/renovate-config.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.263.5

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ~/.npm holds npm exec's installed package (_npx) as well as downloaded
      # tarballs, so a cache hit skips the install entirely.
      - name: Cache Renovate installation
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: renovate-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ env.RENOVATE_VERSION }}

      # Not --strict: strict mode fails on any pending config migration, which
      # deadlocks a validator bump against Renovate's own migration PR. Real
      # validation errors still fail; a pending migration is surfaced as a
      # warning annotation and resolved by merging Renovate's migration PR.
      # An explicit `shell: bash` runs with pipefail, so tee keeps the exit code.
      - name: Validate Renovate configuration
        shell: bash
        run: |
          log="$RUNNER_TEMP/renovate-config-validator.log"
          npm exec --yes --package="renovate@$RENOVATE_VERSION" -- \
            renovate-config-validator renovate.json5 2>&1 | tee "$log"
          if grep -q 'Config migration necessary' "$log"; then
            echo "::warning file=renovate.json5::Renovate config migration pending; merge Renovate's config migration PR"
          fi
