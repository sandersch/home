name: Frigate ingestion image

on:
  pull_request:
    paths: ["containers/frigate-ingest/**", ".github/workflows/frigate-ingest-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        run: |
          version="$(<containers/frigate-ingest/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Eq '^FROM restic/restic:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$' \
            containers/frigate-ingest/Containerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: containers/frigate-ingest
          file: containers/frigate-ingest/Containerfile
          push: false
          tags: ghcr.io/sandersch/frigate-ingest:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          load: true
      - name: Run copier failure tests as the runtime UID
        run: docker run --rm -e PYTHONPATH=/usr/local/bin --entrypoint python3 ghcr.io/sandersch/frigate-ingest:${{ github.sha }} /tests/test_ingest.py

      - name: Exercise local and B2 restore entrypoints
        run: docker run --rm --user 0:65534 --entrypoint /bin/sh ghcr.io/sandersch/frigate-ingest:${{ github.sha }} /tests/test_restore.sh

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite release tag
        id: release
        run: |
          version="$(<containers/frigate-ingest/VERSION)"
          image="ghcr.io/sandersch/frigate-ingest:$version"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image $image" >&2
            exit 1
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: containers/frigate-ingest
          file: containers/frigate-ingest/Containerfile
          push: true
          tags: ${{ steps.release.outputs.image }}
          platforms: linux/amd64
          provenance: true
      - name: Record immutable image digest
        run: |
          {
            echo '### Frigate ingestion image published'
            echo
            echo 'Set the backup CronJob image to:'
            echo
            echo '```text'
            echo '${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
