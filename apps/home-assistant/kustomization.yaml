apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant

resources:
  - namespace.yaml
  - storage.yaml
  - service.yaml
  - ingress.yaml
  - deployment.yaml

configMapGenerator:
  - name: home-assistant-seed
    files:
      - configuration.yaml
      - automations.yaml
