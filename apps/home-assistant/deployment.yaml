apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: homelab-critical
      initContainers:
        - name: seed-config
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -f /config/configuration.yaml ]; then
                cp /seed/configuration.yaml /config/configuration.yaml
              fi
              if [ ! -f /config/automations.yaml ]; then
                cp /seed/automations.yaml /config/automations.yaml
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed-config
              mountPath: /seed
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.2@sha256:56690a89c79a0de98035e1719f8324a92d5859c1192ff45adb0230ea81cb42a5
          env:
            - name: TZ
              value: America/Chicago
          ports:
            - name: http
              containerPort: 8123
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config-pvc
        - name: seed-config
          configMap:
            name: home-assistant-seed
