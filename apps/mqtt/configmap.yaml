apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mqtt
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 1800

    log_dest stdout
    connection_messages true

    listener 1883 0.0.0.0
    allow_anonymous false
    password_file /mosquitto/passwd/passwords
