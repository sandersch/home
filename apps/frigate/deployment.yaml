apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: frigate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frigate
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: homelab-critical
      securityContext:
        supplementalGroups:
          - 44
          - 993
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:0.18.3@sha256:d1a3e0008557bb3f3314d442ecd4ba68e9b16ab7872d64612649f7a6e5156635
          securityContext:
            privileged: true
          envFrom:
            - secretRef:
                name: frigate
            - secretRef:
                name: frigate-mqtt
          env:
            - name: TZ
              value: America/Chicago
          ports:
            - name: http-auth
              containerPort: 8971
            - name: http-local
              containerPort: 5000
          startupProbe:
            httpGet:
              host: 127.0.0.1
              path: /api/version
              port: http-local
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /api/version
              port: http-local
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Generous ~5m liveness window exceeds the 122-245s md3 consistency
          # check I/O stalls documented in the storage migration worklog.
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /api/version
              port: http-local
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
              gpu.intel.com/i915: "1"
            limits:
              cpu: "4"
              memory: 4Gi
              gpu.intel.com/i915: "1"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-file
              mountPath: /config/config.yml
              subPath: config.yml
              readOnly: true
            - name: cache
              mountPath: /tmp/cache
            - name: recordings
              mountPath: /media/frigate
            - name: coral
              mountPath: /dev/bus/usb
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config-pvc
        - name: config-file
          configMap:
            name: frigate-config
        - name: cache
          persistentVolumeClaim:
            claimName: frigate-cache-pvc
        - name: recordings
          hostPath:
            path: /mnt/frigate
            type: Directory
        - name: coral
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
