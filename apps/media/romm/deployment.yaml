apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: media
  labels:
    app.kubernetes.io/name: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
    spec:
      priorityClassName: homelab-standard
      initContainers:
        - name: data-permissions
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data/assets /data/config /data/db /data/resources /data/valkey
              chown -R 1000:1000 /data/assets /data/config /data/resources
              chown -R 999:999 /data/db
              chown -R 999:999 /data/valkey
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: romm
          image: rommapp/romm:5.2.0@sha256:3512f2ca455782f90247271bed23116e6bc675bc74e379be2c41696e607ab11e
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: TZ
              value: America/Chicago
            - name: ROMM_BASE_PATH
              value: /romm
            - name: ROMM_BASE_URL
              value: https://romm.worm.run
            - name: ROMM_PORT
              value: "8080"
            - name: ROMM_DB_DRIVER
              value: mariadb
            - name: DB_HOST
              value: 127.0.0.1
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: DB_PASSWD
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: ROMM_AUTH_SECRET_KEY
            - name: REDIS_HOST
              value: 127.0.0.1
            - name: REDIS_PORT
              value: "6379"
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: IGDB_CLIENT_ID
                  optional: true
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: IGDB_CLIENT_SECRET
                  optional: true
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: SCREENSCRAPER_USER
                  optional: true
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: SCREENSCRAPER_PASSWORD
                  optional: true
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: RETROACHIEVEMENTS_API_KEY
                  optional: true
            - name: STEAMGRIDDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: STEAMGRIDDB_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /romm/assets
              subPath: assets
            - name: data
              mountPath: /romm/config
              subPath: config
            - name: data
              mountPath: /romm/resources
              subPath: resources
            - name: library
              mountPath: /romm/library
        - name: mariadb
          image: mariadb:11.4.12@sha256:1b46b73d4b629022dfa29e6db3bb0d63b5df714fc3bfbe5057d63d76d8f6054b
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: romm
            - name: MARIADB_USER
              value: romm
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: MARIADB_PASSWORD
          ports:
            - name: mariadb
              containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: db
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        - name: valkey
          image: valkey/valkey:8.1.8@sha256:c6d4637d757379a2ff040148b95c85936d85a06c129eafa5fbe582f9e720e12f
          args:
            - valkey-server
            - --appendonly
            - "yes"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: valkey
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: romm-data-pvc
        - name: library
          hostPath:
            path: /mnt/games
            type: Directory
