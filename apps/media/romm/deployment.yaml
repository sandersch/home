apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: media
  labels:
    app.kubernetes.io/name: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
    spec:
      priorityClassName: homelab-standard
      initContainers:
        - name: data-permissions
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data/assets /data/config /data/db /data/resources /data/valkey
              chown -R 1000:1000 /data/assets /data/config /data/resources
              chown -R 999:999 /data/db
              chown -R 999:999 /data/valkey
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: romm
          image: rommapp/romm:5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: TZ
              value: America/Chicago
            - name: ROMM_BASE_PATH
              value: /romm
            - name: ROMM_BASE_URL
              value: https://romm.worm.run
            - name: ROMM_PORT
              value: "8080"
            # 5.3 raised the gunicorn default from 1 to 4 (~215Mi each), which
            # OOMs the 1Gi limit once rq cron jobs run.
            - name: WEB_SERVER_CONCURRENCY
              value: "2"
            - name: ROMM_DB_DRIVER
              value: mariadb
            - name: DB_HOST
              value: 127.0.0.1
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: DB_PASSWD
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: ROMM_AUTH_SECRET_KEY
            - name: REDIS_HOST
              value: 127.0.0.1
            - name: REDIS_PORT
              value: "6379"
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: IGDB_CLIENT_ID
                  optional: true
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: IGDB_CLIENT_SECRET
                  optional: true
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: SCREENSCRAPER_USER
                  optional: true
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: SCREENSCRAPER_PASSWORD
                  optional: true
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: RETROACHIEVEMENTS_API_KEY
                  optional: true
            - name: STEAMGRIDDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: STEAMGRIDDB_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 2048Mi
          volumeMounts:
            - name: data
              mountPath: /romm/assets
              subPath: assets
            - name: data
              mountPath: /romm/config
              subPath: config
            - name: data
              mountPath: /romm/resources
              subPath: resources
            - name: library
              mountPath: /romm/library
        - name: mariadb
          image: mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: romm
            - name: MARIADB_USER
              value: romm
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: MARIADB_PASSWORD
          ports:
            - name: mariadb
              containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: db
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        - name: valkey
          image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          args:
            - valkey-server
            - --appendonly
            - "yes"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: valkey
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: romm-data-pvc
        - name: library
          hostPath:
            path: /mnt/games
            type: Directory
