apiVersion: v1
kind: Service
metadata:
  name: romm-mariadb
  namespace: media
spec:
  type: ClusterIP
  # Keep MariaDB reachable for the mandatory appstate backup dump even if the
  # colocated romm or valkey container fails its readinessProbe.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: romm
  ports:
    - name: mariadb
      port: 3306
      targetPort: mariadb
