apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabnzbd
  namespace: media
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sabnzbd.worm.run
  rules:
    - host: sabnzbd.worm.run
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gluetun
                port:
                  name: sabnzbd
