apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun
  namespace: media
  labels:
    app.kubernetes.io/name: download-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: download-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: download-stack
    spec:
      priorityClassName: homelab-standard
      containers:
        - name: gluetun
          # upstream-version: unreleased-2026-08-07-revision-7eed6eaf
          image: ghcr.io/qdm12/gluetun@sha256:8e92dcb57ed64b0e4469c933f00ef1e09ee00867fee150e783a95fa6b53effa4
          envFrom:
            - secretRef:
                name: gluetun-mullvad
          env:
            - name: VPN_SERVICE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: gluetun-config
                  key: VPN_SERVICE_PROVIDER
            - name: VPN_TYPE
              valueFrom:
                configMapKeyRef:
                  name: gluetun-config
                  key: VPN_TYPE
            - name: SERVER_COUNTRIES
              valueFrom:
                configMapKeyRef:
                  name: gluetun-config
                  key: SERVER_COUNTRIES
            - name: FIREWALL_INPUT_PORTS
              valueFrom:
                configMapKeyRef:
                  name: gluetun-config
                  key: FIREWALL_INPUT_PORTS
            - name: FIREWALL_OUTBOUND_SUBNETS
              valueFrom:
                configMapKeyRef:
                  name: gluetun-config
                  key: FIREWALL_OUTBOUND_SUBNETS
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: gluetun-config
                  key: TZ
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:5.1.0-ls266@sha256:b0f9755d795913bd26ae3f3a12805668ab0681ab847a7624568559c573fc7cae
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          ports:
            - name: sabnzbd
              containerPort: 8080
          resources:
            requests:
              cpu: 125m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: sabnzbd-config
              mountPath: /config
            - name: sabnzbd-incomplete
              mountPath: /incomplete
            - name: media
              mountPath: /media
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls471@sha256:6816d2b144b1eb97665f886e41e18a14d026ba78c9d0953fc68a1211ea819433
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: WEBUI_PORT
              value: "8090"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - name: qbittorrent
              containerPort: 8090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: qbittorrent-incomplete
              mountPath: /incomplete
            - name: media
              mountPath: /media
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          ports:
            - name: prowlarr
              containerPort: 9696
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          ports:
            - name: radarr
              containerPort: 7878
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: media
              mountPath: /media
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls321@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          ports:
            - name: sonarr
              containerPort: 8989
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: sabnzbd-config
          persistentVolumeClaim:
            claimName: sabnzbd-config-pvc
        - name: sabnzbd-incomplete
          persistentVolumeClaim:
            claimName: sabnzbd-incomplete-pvc
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: qbittorrent-incomplete
          persistentVolumeClaim:
            claimName: qbittorrent-incomplete-pvc
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config-pvc
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config-pvc
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config-pvc
        - name: media
          hostPath:
            path: /mnt/media
            type: Directory
