apiVersion: v1
kind: PersistentVolume
metadata:
  name: seerr-config-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-nvme
  hostPath:
    path: /opt/seerr/config
    type: DirectoryOrCreate
  claimRef:
    namespace: media
    name: seerr-config-pvc
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config-pvc
  namespace: media
spec:
  storageClassName: local-nvme
  accessModes:
    - ReadWriteOnce
  volumeName: seerr-config-pv
  resources:
    requests:
      storage: 5Gi
