# Temporary FluxResourceNotReady drill (2026-11-22). The path below does not
# exist, so this Kustomization reports Ready=False and the homelab.flux rule
# should page Pushover after 30 minutes. Nothing depends on it and it applies
# nothing. Remove this file and its entry in kustomization.yaml to end the
# drill; flux-system prunes the object and the alert should resolve.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-alert-drill
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./drills/flux-alert-drill-path-does-not-exist
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
