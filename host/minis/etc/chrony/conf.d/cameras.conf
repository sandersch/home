# Camera-segment NTP (build-plan.md Phase 1.3). Cameras have no internet, so the host
# is their only time source; without it their clocks drift and Frigate event timestamps
# corrupt. Requires chrony installed in Phase 0.3 (it supersedes systemd-timesyncd, which
# is client-only and cannot serve). The matching `udp dport 123` allow is in the Phase
# 1.1 nftables input chain.
#
# No `bindaddress` — chrony listens on all interfaces by default. Binding to
# 192.168.104.1 would require that address to exist on cam0 at chrony start, but NIC2
# is optional:true and may have no carrier at boot, so the bind could fail and silently
# leave the segment unserved (chrony has no lazy-bind like dnsmasq's bind-dynamic).
# Listening on all interfaces is harmless: `allow` below only authorizes the camera
# subnet, so NTP requests arriving on any other interface (e.g. the LAN) reach the
# socket but are refused — the open socket is not an open service.

allow 192.168.104.0/24      # answer NTP from the camera segment
# Serve the host's own clock as a low-stratum fallback. Without this, a WAN outage
# leaves chrony unsynchronized and it REFUSES to serve the segment — and the cameras
# have no other time source, so they drift, which is exactly what 1.3 exists to prevent.
local stratum 10
