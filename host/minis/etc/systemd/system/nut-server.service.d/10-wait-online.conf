# upsd binds lan0's static IP (upsd.conf: LISTEN 10.137.20.5), but stock nut-server
# only orders after network.target, which doesn't guarantee addresses are assigned
# yet. Without this, a boot race can leave upsd bound to 127.0.0.1 alone — shutdown
# protection still works (upsmon uses loopback) but UPS telemetry is silently blind
# until the next nut-server restart.
[Unit]
Wants=network-online.target
After=network-online.target
