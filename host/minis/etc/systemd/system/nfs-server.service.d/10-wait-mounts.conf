# Order nfs-server after the bulk-storage automount units so exportfs sees real
# mountpoints when nfsd starts (the `mountpoint` export option refuses otherwise).
#
# Deliberately After= and not RequiresMountsFor=: the latter would force both
# filesystems up at boot and defeat the x-systemd.automount entries in fstab.
[Unit]
After=mnt-media.automount mnt-games.automount network-online.target
Wants=network-online.target
