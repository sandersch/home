# Disable NVMe autonomous power state transitions (APST) on minis.
# Boot-menu trial accepted as the NVMe sleep/wake fix on 2026-10-07 after
# 23 days of uptime. Keep this through kernel updates and host rebuilds.
# GRUB_CMDLINE_LINUX covers normal AND recovery entries; preserve other flags.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+${GRUB_CMDLINE_LINUX} }nvme_core.default_ps_max_latency_us=0"
