# Homelab SSH hardening (build-plan.md Phase 0.1). Drop-in under sshd_config.d/, which
# Ubuntu's stock /etc/ssh/sshd_config includes via `Include /etc/ssh/sshd_config.d/*.conf`.
# A drop-in is used (not editing the main file) so the package's config stays pristine
# and upgrades don't clobber these settings.
#
# IMPORTANT: copy your public key up (`ssh-copy-id charlie@172.17.1.5`) and confirm a key
# login works BEFORE restarting sshd — `PasswordAuthentication no` will otherwise lock you
# out. Keep a second session open during the restart as a safety net.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# SSH is reachable on the LAN and the Tailnet, and is the sanctioned tunnel path for
# camera web UIs (build-plan.md 1.1). No public exposure — nothing is port-forwarded.
