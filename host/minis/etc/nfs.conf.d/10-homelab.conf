# Homelab NFS server settings (docs/operations.md -> NFS exports).
#
# A drop-in, not a replacement for the stock /etc/nfs.conf -- same convention as
# sshd_config.d/10-homelab.conf and chrony/conf.d/cameras.conf. Ubuntu reads
# /etc/nfs.conf.d/*.conf after /etc/nfs.conf, so only the settings below are ours.

[nfsd]
# NFSv4 only. v2/v3 and UDP are off, so the whole service is one port (TCP 2049):
# no rpcbind, no rpc.statd, no auxiliary port sprawl to firewall or to forget.
# vers2 is set for the record even though Ubuntu 24.04's 6.8 kernel is built without
# CONFIG_NFSD_V2 and so cannot serve it: the key documents intent and keeps the setting
# correct if the export ever moves to a kernel that does implement v2. It also explains
# why /proc/fs/nfsd/versions shows no `2` token at all here rather than `-2`.
vers2 = n
vers3 = n
vers4 = y
# 4.0 is the only version whose callback channel needs a connection back to the
# client. 4.1/4.2 carry callbacks on the existing session, so dropping 4.0 removes
# that inbound-to-client requirement entirely.
vers4.0 = n
vers4.1 = y
vers4.2 = y
udp = n
tcp = y
rdma = n

# 16 rather than the stock 8: the array serves several bulk streamers alongside the
# colocated k3s pods. Revisit only if node_nfsd_server_threads shows saturation.
threads = 16

# Listener scoping: open nfsd sockets only on the lan0 address and loopback, never on
# cam0's 192.168.105.1/192.168.1.2 addresses or a wildcard address. This limits local
# destination addresses; it does NOT constrain the ingress interface. A packet arriving
# through another interface but addressed to 10.137.20.5 can still reach this socket.
# The nfs_access nftables table enforces the source/interface policy, and /etc/exports
# independently authorizes the VLAN 20/30 client CIDRs for actual mounts.
#
# The separator MUST be a comma. nfsd(8) defines this key as "a host name, or comma
# separated list of host names"; a space-separated value is parsed as one hostname,
# fails to resolve, and rpc.nfsd does not come up.
host = 10.137.20.5,127.0.0.1
