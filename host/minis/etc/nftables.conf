#!/usr/sbin/nft -f
#
# Camera-segment isolation (build-plan.md Phase 1.1), Frigate local API gating, and
# UPS telemetry gating (operations.md → UPS / NUT). This file replaces the stock
# Ubuntu /etc/nftables.conf. It manages ONLY our `camera_isolation`,
# `frigate_access`, and `ups_access` tables.
#
# DO NOT add `flush ruleset` here. k3s/flannel/kube-proxy inject rules into the
# nat/filter/mangle tables at runtime; a global flush on `systemctl reload nftables`
# would wipe them and break pod networking until k3s re-syncs. The delete+recreate of
# just our own table below is idempotent and k3s-safe.
#
# Camera segment NIC is cam0 (NIC2, 192.168.105.1/24). policy accept on both chains
# is intentional — policy drop would break k3s's own nft chains (each hook chain is
# evaluated independently and a drop verdict anywhere is final). The explicit drops do
# the isolation. See architecture.md → Networking.

table inet camera_isolation {}
delete table inet camera_isolation
table inet camera_isolation {
  chain forward {
    type filter hook forward priority 0; policy accept;
    # Rate-limited log (no verdict → falls through) then an unconditional counter drop.
    # The log rule must NOT carry the drop verdict: if `limit` gated the drop, packets
    # over the rate would skip it and hit `policy accept`.
    iifname "cam0" limit rate 10/minute log prefix "cam-drop-fwd-in "   # camera→anywhere
    iifname "cam0" counter drop
    oifname "cam0" limit rate 10/minute log prefix "cam-drop-fwd-out "  # LAN→camera (host-only access)
    oifname "cam0" counter drop
  }
  chain input {
    type filter hook input priority 0; policy accept;
    iifname "cam0" ct state established,related accept   # RTSP/stream replies (host initiates)
    iifname "cam0" udp dport 67 accept                   # DHCP (dnsmasq)
    iifname "cam0" udp dport 123 accept                  # NTP (chrony, Phase 1.3)
    iifname "cam0" icmp type echo-request accept         # ping diagnostics ONLY — not all ICMP
                                                            #   (a broad `ip protocol icmp` allow would let a
                                                            #    compromised camera send the host ICMP redirects).
                                                            #   Host→camera ping replies still pass via established.
    iifname "cam0" udp dport 53 counter drop             # expected camera DNS retries; keep blocked but quiet
    iifname "cam0" tcp dport 53 counter drop
    iifname "cam0" limit rate 10/minute log prefix "cam-drop-input "    # all other camera→host
    iifname "cam0" counter drop
  }
}

# Frigate uses host networking so it can reach cameras directly through cam0. That
# also binds its unauthenticated HTTP/API listener on TCP 5000 to every host address.
# Keep that listener usable by host-local diagnostics while denying LAN, Tailnet,
# camera-segment, and pod-network clients. Authenticated access continues through the
# Kubernetes Service/Ingress on TCP 8971.
table inet frigate_access {}
delete table inet frigate_access
table inet frigate_access {
  chain input {
    type filter hook input priority 0; policy accept;
    iifname "lo" tcp dport 5000 accept
    tcp dport 5000 limit rate 10/minute log prefix "frigate-5000-drop "
    tcp dport 5000 counter drop
  }
}

# UPS telemetry gating (operations.md → UPS / NUT). upsd also listens on lan0's IP
# (upsd.conf) so in-cluster NUT clients — Home Assistant's NUT integration and the
# nut-exporter — can poll it. The input policy above is accept, so without this table
# the whole LAN could reach upsd; these rules pin TCP 3493 to loopback (upsmon, plus
# host-local checks like `upsc cp1500@10.137.20.5`, which arrive via lo) and the k3s
# pod CIDR, and drop everyone else. Same idempotent delete+recreate pattern as above.
table inet ups_access {}
delete table inet ups_access
table inet ups_access {
  chain input {
    type filter hook input priority 0; policy accept;
    iifname "lo" tcp dport 3493 accept
    ip saddr 10.42.0.0/16 tcp dport 3493 accept    # k3s pod CIDR (flannel default)
    tcp dport 3493 limit rate 10/minute log prefix "ups-drop-input "
    tcp dport 3493 counter drop
  }
}
