# Camera-segment DHCP (build-plan.md Phase 1.2). Host-level systemd service, not a pod.
# Serves DHCP only on the isolated 192.168.105.0/24 segment via NIC2 (cam0).

interface=cam0
bind-dynamic            # bind as the interface appears; survives a boot with no carrier
                        # on NIC2 (optional:true). bind-interfaces would fail to start
                        # with no camera connected at boot.
port=0                  # DHCP only, no DNS. Frigate targets cameras by IP, and a resolver
                        # here would be an outbound beacon path for a compromised camera.
dhcp-range=192.168.105.100,192.168.105.199,12h  # DYNAMIC pool only. Static reservations
                        # (dhcp-host, below) live in a dedicated .50-.99 block so a pinned
                        # camera IP can never collide with a transient dynamic lease. The split
                        # is effectively permanent once cameras are pinned (their IPs get typed
                        # into NTP/Frigate config), so it's fixed deliberately up front.
dhcp-authoritative      # sole DHCP server on an isolated segment; speeds up leases

# Hand cameras the host as NTP server (option 42) — BEST EFFORT. Amcrest/Dahua cameras
# generally ignore option 42 and use the NTP server set in their own web UI; the
# authoritative per-camera NTP is set in Phase 1.3. Deliberately NO router option
# (option 3): an isolated segment needs no default route, and withholding it stops
# cameras even attempting off-segment traffic (the forward drop is the backstop).
dhcp-option=option:ntp-server,192.168.105.1

# NIC2's 192.168.1.2/24 alias (for reaching a factory-default camera at .108) is
# intentionally NOT served DHCP — it's a manual provisioning path, not the live segment.

# TODO (before Frigate, Phase 4c): pin every camera by MAC so Frigate's IP-addressed
# config is stable. Blocked on finishing switch port-isolation (1.1b) and connecting
# cameras to collect MACs. One line per camera (reserving in-range is fine):
# dhcp-host=AA:BB:CC:DD:EE:FF,192.168.105.51    # reserve in the static .50-.99 block
