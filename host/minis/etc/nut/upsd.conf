# lan0 IP, so in-cluster NUT clients (Home Assistant's NUT integration, the Phase 5
# nut-exporter) can poll upsd read-only. Anonymous reads are fine here because
# nftables.conf (ups_access table) pins TCP 3493 to loopback + the k3s pod CIDR.
# Binding a specific IP needs the address present at start — see the nut-server
# systemd drop-in (10-wait-online.conf), which orders it after network-online.
