#!/usr/sbin/nft -f
#
# Camera-segment isolation (build-plan.md Phase 1.1). This file replaces the stock
# Ubuntu /etc/nftables.conf. It manages ONLY our `camera_isolation` table.
#
# DO NOT add `flush ruleset` here. k3s/flannel/kube-proxy inject rules into the
# nat/filter/mangle tables at runtime; a global flush on `systemctl reload nftables`
# would wipe them and break pod networking until k3s re-syncs. The delete+recreate of
# just our own table below is idempotent and k3s-safe.
#
# Camera segment NIC is enp87s0 (NIC2, 192.168.104.1/24). policy accept on both chains
# is intentional — policy drop would break k3s's own nft chains (each hook chain is
# evaluated independently and a drop verdict anywhere is final). The explicit drops do
# the isolation. See architecture.md → Networking.

table inet camera_isolation {}
delete table inet camera_isolation
table inet camera_isolation {
  chain forward {
    type filter hook forward priority 0; policy accept;
    # Rate-limited log (no verdict → falls through) then an unconditional counter drop.
    # The log rule must NOT carry the drop verdict: if `limit` gated the drop, packets
    # over the rate would skip it and hit `policy accept`.
    iifname "enp87s0" limit rate 10/minute log prefix "cam-drop-fwd-in "   # camera→anywhere
    iifname "enp87s0" counter drop
    oifname "enp87s0" limit rate 10/minute log prefix "cam-drop-fwd-out "  # LAN→camera (host-only access)
    oifname "enp87s0" counter drop
  }
  chain input {
    type filter hook input priority 0; policy accept;
    iifname "enp87s0" ct state established,related accept   # RTSP/stream replies (host initiates)
    iifname "enp87s0" udp dport 67 accept                   # DHCP (dnsmasq)
    iifname "enp87s0" udp dport 123 accept                  # NTP (chrony, Phase 1.3)
    iifname "enp87s0" ip protocol icmp accept               # IPv4 ping for diagnostics (segment is v4-only)
    iifname "enp87s0" limit rate 10/minute log prefix "cam-drop-input "    # all other camera→host
    iifname "enp87s0" counter drop
  }
}
