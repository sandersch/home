# The monitor password is redacted — restore it from the password manager and keep it
# identical to the password in upsd.users. See host/README.md (NUT secret note).
MONITOR cp1500@localhost 1 upsmon __REPLACE_WITH_UPSMON_PASSWORD__ master
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
