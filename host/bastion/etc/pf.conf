# OpenBSD bastion policy. This host is an endpoint on two VLANs, never a router.
set block-policy drop
set state-policy if-bound
set skip on lo

vlan30_addr = "10.137.30.8"
vlan30_net  = "10.137.30.0/24"
vlan30_gw   = "10.137.30.1"
ntp_servers = "{ 162.159.200.1, 162.159.200.123 }"
vlan10_addr = "10.137.10.8"
vlan10_net  = "10.137.10.0/24"

block all
antispoof quick for { vlan10 vlan30 }

# The only inbound services are SSH on the operator-side address and NTP on
# the Admin-side address. NTP is available only to directly attached VLAN 10.
pass in quick on vlan30 inet proto tcp from $vlan30_net to $vlan30_addr port 22 flags S/SA keep state
pass in quick on vlan10 inet proto udp from $vlan10_net to $vlan10_addr port 123 keep state
# In OpenBSD 7.9, max-pkt-rate is a filter option: above the threshold this
# first rule stops matching. The second quick rule therefore drops excess
# packets without logging them. Labels expose both counters to pfctl.
block in log quick on vlan10 all max-pkt-rate 5/1 label "vlan10-denied-logged"
block in quick on vlan10 all label "vlan10-denied-unlogged"

# Base-system resolution, clock sync, firmware retrieval, signed errata, and
# release upgrades leave only through VLAN 30. TCP/53 permits large DNS replies
# and fallback. HTTP(S) is restricted to the privilege-separated fetch users
# for fw_update, syspatch, and sysupgrade, while OpenNTPD's user may use HTTPS
# only for its configured time constraint.
pass out quick on vlan30 inet proto { udp tcp } from $vlan30_addr to $vlan30_gw port 53 keep state
pass out quick on vlan30 inet proto udp from $vlan30_addr to $ntp_servers port 123 keep state
pass out quick on vlan30 inet proto tcp from $vlan30_addr to any port 443 user _ntp flags S/SA keep state
pass out quick on vlan30 inet proto tcp from $vlan30_addr to any port { 80 443 } user { _file, _syspatch } flags S/SA keep state

# Operator-initiated management sessions may originate from the bastion to the
# directly connected Admin subnet. No inbound state is created by this rule.
pass out quick on vlan10 inet from $vlan10_addr to $vlan10_net keep state
