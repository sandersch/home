# Use fixed, provider-documented IPv4 anycast endpoints so PF can constrain
# NTP egress exactly. The independent HTTPS constraint protects the
# unauthenticated NTP samples from large man-in-the-middle time shifts.
query from 10.137.30.9
listen on 10.137.10.9
server 162.159.200.1
server 162.159.200.123
constraints from "https://www.google.com/"
