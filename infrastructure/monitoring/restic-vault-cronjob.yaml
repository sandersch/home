apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-vault-backup
  namespace: monitoring
  labels:
    app.kubernetes.io/name: restic-vault-backup
spec:
  schedule: 15 2,6,10,14,18,22 * * *
  timeZone: America/Chicago
  suspend: false
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-vault-backup
        spec:
          restartPolicy: Never
          priorityClassName: homelab-low
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: minis
          securityContext:
            runAsUser: 0
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: ghcr.io/sandersch/restic-backup:0.19.1-1@sha256:58cddae970e91cb4f8f18db69d9d7d526d1e1d803193a65afb2f7f3a43aa9097
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - /guards/assert-backups-mount.sh && exec /scripts/backup-vault.sh
              env:
                - name: RESTIC_REPOSITORY
                  value: /repo/nas/vault
                - name: RESTIC_PASSWORD_FILE
                  value: /data/vault/.backup-credentials/nas-password
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: '1'
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 0
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_OVERRIDE
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: guard
                  mountPath: /guards
                  readOnly: true
                - name: contract
                  mountPath: /contracts
                  readOnly: true
                - name: host-config
                  mountPath: /host-config/vault.conf
                  readOnly: true
                - name: vault
                  mountPath: /data/vault
                  readOnly: true
                - name: backups
                  mountPath: /repo/nas
                - name: metrics
                  mountPath: /metrics
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: restic-vault-config
                defaultMode: 365
            - name: guard
              configMap:
                name: restic-mount-guard
                defaultMode: 365
            - name: contract
              configMap:
                name: restic-vault-contract
            - name: host-config
              hostPath:
                path: /etc/homelab/vault.conf
                type: File
            - name: vault
              hostPath:
                path: /mnt/vault
                type: Directory
            - name: backups
              hostPath:
                path: /mnt/backups
                type: Directory
            - name: metrics
              hostPath:
                path: /var/lib/node-exporter/textfile
                type: Directory
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
