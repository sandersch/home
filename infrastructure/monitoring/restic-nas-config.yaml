apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-nas-config
  namespace: monitoring
data:
  RESTIC_REPOSITORY: /repo/nas/opt
  RESTIC_HOST: minis
  RESTIC_KEEP_DAILY: "14"
  RESTIC_KEEP_WEEKLY: "8"
  RESTIC_KEEP_MONTHLY: "12"
  HOME_ASSISTANT_URL: http://home-assistant.home-assistant.svc.cluster.local:8123
  ROMM_DB_HOST: romm-mariadb.media.svc.cluster.local
  ROMM_DB_PORT: "3306"
  ROMM_DB_NAME: romm
  ROMM_DB_USER: romm
  backup.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    log() { printf '[%s] %s\n' "$(date -Iseconds)" "$*"; }
    die() { log "ERROR: $*"; exit 1; }
    require_env() {
      local name
      for name in "$@"; do
        [ -n "${!name:-}" ] || die "$name is required"
      done
    }

    require_env RESTIC_REPOSITORY RESTIC_PASSWORD RESTIC_HOST HOME_ASSISTANT_TOKEN ROMM_DB_PASSWORD

    WORK_DIR="${BACKUP_WORK_DIR:-/work}"
    HOT_DUMPS="$WORK_DIR/hot-dumps"
    SQLITE_DUMPS="$HOT_DUMPS/sqlite"
    ROMM_DUMPS="$HOT_DUMPS/romm"
    HA_MARKER="$WORK_DIR/home-assistant-backup-marker"
    mkdir -p "$SQLITE_DUMPS" "$ROMM_DUMPS" "$WORK_DIR/restic-cache"
    export RESTIC_CACHE_DIR="$WORK_DIR/restic-cache"

    dump_sqlite() {
      log "creating SQLite hot backups from /data/opt"
      local db rel out escaped count
      count=0
      while IFS= read -r -d '' db; do
        if sqlite3 -readonly "$db" 'PRAGMA quick_check;' >/dev/null 2>&1; then
          rel="${db#/data/opt/}"
          out="$SQLITE_DUMPS/${rel}.sqlite-backup"
          mkdir -p "$(dirname "$out")"
          escaped="${out//\'/\'\'}"
          sqlite3 -readonly "$db" ".backup '$escaped'"
          count=$((count + 1))
        else
          log "skipping non-SQLite or unhealthy DB candidate: $db"
        fi
      done < <(find /data/opt -type f -name '*.db' -print0)
      log "created $count SQLite backup file(s)"
    }

    trigger_home_assistant_backup() {
      log "triggering Home Assistant managed backup"
      touch "$HA_MARKER"
      curl -fsS \
        -X POST \
        -H "Authorization: Bearer $HOME_ASSISTANT_TOKEN" \
        -H 'Content-Type: application/json' \
        "${HOME_ASSISTANT_URL%/}/api/services/homeassistant/backup" \
        -d '{}' >/tmp/home-assistant-backup-response.json

      local backup_dir="/data/opt/home-assistant/config/backups"
      for _ in $(seq 1 60); do
        if [ -d "$backup_dir" ] && find "$backup_dir" -maxdepth 1 -type f -newer "$HA_MARKER" | grep -q .; then
          log "Home Assistant backup artifact appeared"
          return 0
        fi
        sleep 10
      done
      die "Home Assistant backup did not produce a new artifact within 10 minutes"
    }

    dump_romm() {
      log "dumping RomM MariaDB"
      mariadb-dump \
        --protocol=tcp \
        -h "${ROMM_DB_HOST:-romm-mariadb.media.svc.cluster.local}" \
        -P "${ROMM_DB_PORT:-3306}" \
        -u "${ROMM_DB_USER:-romm}" \
        "-p$ROMM_DB_PASSWORD" \
        --single-transaction \
        --quick \
        --databases "${ROMM_DB_NAME:-romm}" \
        >"$ROMM_DUMPS/romm.sql"
    }

    run_restic() {
      log "checking Restic repository"
      restic snapshots --host "$RESTIC_HOST" >/dev/null

      log "running Restic backup"
      restic backup \
        --host "$RESTIC_HOST" \
        --tag opt \
        --tag nas \
        /data/opt \
        "$HOT_DUMPS"

      log "applying Restic retention policy"
      restic forget \
        --host "$RESTIC_HOST" \
        --tag opt \
        --keep-daily "${RESTIC_KEEP_DAILY:-14}" \
        --keep-weekly "${RESTIC_KEEP_WEEKLY:-8}" \
        --keep-monthly "${RESTIC_KEEP_MONTHLY:-12}" \
        --prune
    }

    dump_sqlite
    trigger_home_assistant_backup
    dump_romm
    run_restic
    log "backup complete"
