apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-nas-config
  namespace: monitoring
data:
  RESTIC_REPOSITORY: /repo/nas/opt
  RESTIC_HOST: minis
  RESTIC_TARGET_TAG: nas
  RESTIC_KEEP_DAILY: "14"
  RESTIC_KEEP_WEEKLY: "8"
  RESTIC_KEEP_MONTHLY: "12"
  BACKUP_CONTRACT_VERSION: "2"
  REQUIRED_SQLITE_DATABASES: |-
    plex/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db
    plex/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db
    frigate/config/frigate.db
    home-assistant/config/home-assistant_v2.db
    prowlarr/config/prowlarr.db
    radarr/config/radarr.db
    sonarr/config/sonarr.db
    seerr/config/db/db.sqlite3
  HOME_ASSISTANT_URL: http://home-assistant.home-assistant.svc.cluster.local:8123
  HOME_ASSISTANT_BACKUP_DOMAIN: backup
  HOME_ASSISTANT_BACKUP_SERVICE: create_automatic
  ROMM_DB_HOST: romm-mariadb.media.svc.cluster.local
  ROMM_DB_PORT: "3306"
  ROMM_DB_NAME: romm
  ROMM_DB_USER: romm
  backup.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    log() { printf '[%s] %s\n' "$(date -Iseconds)" "$*"; }
    die() { log "ERROR: $*"; exit 1; }
    require_env() {
      local name
      for name in "$@"; do
        [ -n "${!name:-}" ] || die "$name is required"
      done
    }

    require_env \
      RESTIC_REPOSITORY \
      RESTIC_PASSWORD \
      RESTIC_HOST \
      BACKUP_CONTRACT_VERSION \
      REQUIRED_SQLITE_DATABASES \
      HOME_ASSISTANT_TOKEN \
      ROMM_DB_PASSWORD

    BACKUP_STARTED_EPOCH="$(date +%s)"
    WORK_DIR="${BACKUP_WORK_DIR:-/work}"
    HOT_DUMPS="$WORK_DIR/hot-dumps"
    SQLITE_DUMPS="$HOT_DUMPS/sqlite"
    K3S_DUMPS="$HOT_DUMPS/k3s"
    HA_DUMPS="$HOT_DUMPS/home-assistant"
    ROMM_DUMPS="$HOT_DUMPS/romm"
    HA_BACKUPS_BEFORE="$WORK_DIR/home-assistant-backups-before"
    HA_BACKUPS_AFTER="$WORK_DIR/home-assistant-backups-after"
    if [ -d "$HOT_DUMPS" ] \
      && [ -n "$(find "$HOT_DUMPS" -mindepth 1 -print -quit)" ]; then
      die "$HOT_DUMPS is not empty; refusing to reuse exports from an earlier attempt"
    fi
    mkdir -p "$SQLITE_DUMPS" "$K3S_DUMPS" "$HA_DUMPS" "$ROMM_DUMPS" "$WORK_DIR/restic-cache"
    export RESTIC_CACHE_DIR="$WORK_DIR/restic-cache"

    assert_fresh_file() {
      local path="$1" label="$2" modified
      [ -s "$path" ] || die "$label is missing or empty: $path"
      modified="$(stat -c '%Y' "$path")"
      [ "$modified" -ge "$BACKUP_STARTED_EPOCH" ] \
        || die "$label predates this backup attempt: $path"
    }

    required_sqlite_databases() {
      printf '%s\n' "$REQUIRED_SQLITE_DATABASES" | sed '/^[[:space:]]*$/d'
    }

    dump_sqlite() {
      log "creating SQLite hot backups from /data/opt"
      local db rel out escaped count err required_count source
      count=0
      while IFS= read -r -d '' db; do
        err="$WORK_DIR/sqlite-error"
        rel="${db#/data/opt/}"
        out="$SQLITE_DUMPS/${rel}.sqlite-backup"
        mkdir -p "$(dirname "$out")"
        escaped="${out//\'/\'\'}"
        if sqlite3 -readonly "$db" \
          '.timeout 60000' \
          ".backup '$escaped'" 2>"$err"; then
          if sqlite_backup_health_check "$db" "$out" "$err"; then
            count=$((count + 1))
          else
            rm -f "$out"
            log "skipping SQLite backup that failed validation: $db: $(sqlite_error_summary "$err")"
          fi
        else
          log "skipping non-SQLite or unhealthy DB candidate: $db: $(sqlite_error_summary "$err")"
        fi
      done < <(find /data/opt \
        -path /data/opt/.snapshots -prune -o \
        -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print0)
      required_count=0
      while IFS= read -r rel; do
        source="/data/opt/$rel"
        out="$SQLITE_DUMPS/${rel}.sqlite-backup"
        [ -s "$source" ] || die "required SQLite source is missing or empty: $source"
        assert_fresh_file "$out" "required SQLite hot backup"
        err="$WORK_DIR/sqlite-required-error"
        if ! sqlite_backup_health_check "$source" "$out" "$err"; then
          die "required SQLite hot backup failed validation: $rel: $(sqlite_error_summary "$err")"
        fi
        required_count=$((required_count + 1))
      done < <(required_sqlite_databases)
      [ "$required_count" -gt 0 ] || die "required SQLite inventory is empty"
      log "created $count SQLite backup file(s); validated $required_count required export(s)"
    }

    sqlite_backup_health_check() {
      local source_db="$1" backup_db="$2" err="$3" result
      case "$source_db" in
        /data/opt/plex/config/Library/Application\ Support/Plex\ Media\ Server/Plug-in\ Support/Databases/com.plexapp.plugins.library*.db)
          # Plex may define a custom FTS tokenizer named "collating". Stock
          # sqlite3 can still run .backup, but PRAGMA quick_check can fail
          # while preparing that schema.
          sqlite3 -readonly "$backup_db" 'PRAGMA schema_version; SELECT count(*) FROM sqlite_master;' >/dev/null 2>"$err"
          ;;
        *)
          result="$(sqlite3 -readonly "$backup_db" 'PRAGMA quick_check;' 2>"$err")" || return 1
          if [ "$result" != "ok" ]; then
            printf '%s\n' "$result" >"$err"
            return 1
          fi
          ;;
      esac
    }

    sqlite_error_summary() {
      local err="$1"
      if [ -s "$err" ]; then
        head -c 500 "$err" | tr '\n' ' '
      else
        printf 'no sqlite error output'
      fi
    }

    validate_k3s_backup() {
      local backup="$1" integrity table_count row_count
      [ -s "$backup" ] || die "k3s SQLite backup is missing or empty: $backup"
      integrity="$(sqlite3 -readonly "$backup" 'PRAGMA integrity_check;')" \
        || die "k3s SQLite integrity check could not run"
      [ "$integrity" = ok ] \
        || die "k3s SQLite integrity check failed: $integrity"
      table_count="$(sqlite3 -readonly "$backup" \
        "SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('kine','sqlite_sequence');")" \
        || die "k3s SQLite schema check could not run"
      [ "$table_count" = 2 ] \
        || die "k3s SQLite backup is missing the kine or sqlite_sequence table"
      row_count="$(sqlite3 -readonly "$backup" 'SELECT count(*) FROM kine;')" \
        || die "k3s SQLite kine row check could not run"
      [[ "$row_count" =~ ^[0-9]+$ ]] && [ "$row_count" -gt 0 ] \
        || die "k3s SQLite backup contains no kine rows"
    }

    dump_k3s() {
      local source=/data/k3s-db/state.db
      local output="$K3S_DUMPS/state.db.sqlite-backup"
      local tmp="$output.tmp" escaped
      log "creating transactionally consistent k3s SQLite backup"
      [ -s "$source" ] || die "required k3s SQLite source is missing or empty: $source"
      rm -f -- "$tmp"
      escaped="${tmp//\'/\'\'}"
      sqlite3 -readonly "$source" \
        '.timeout 60000' \
        ".backup '$escaped'" \
        || die "k3s SQLite online backup failed"
      assert_fresh_file "$tmp" "temporary k3s SQLite backup"
      validate_k3s_backup "$tmp"
      mv -- "$tmp" "$output"
      assert_fresh_file "$output" "k3s SQLite backup"
      validate_k3s_backup "$output"
    }

    trigger_home_assistant_backup() {
      log "triggering Home Assistant managed backup"
      local backup_dir="/data/opt/home-assistant/config/backups"
      snapshot_home_assistant_backups "$backup_dir" "$HA_BACKUPS_BEFORE"
      local response_file="/tmp/home-assistant-backup-response.json"
      local status backup
      local -a new_backups=()
      status="$(curl -sS \
        -o "$response_file" \
        -w '%{http_code}' \
        -X POST \
        -H "Authorization: Bearer $HOME_ASSISTANT_TOKEN" \
        -H 'Content-Type: application/json' \
        "${HOME_ASSISTANT_URL%/}/api/services/${HOME_ASSISTANT_BACKUP_DOMAIN:-backup}/${HOME_ASSISTANT_BACKUP_SERVICE:-create_automatic}" \
        -d '{}')"
      if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
        log "Home Assistant backup API returned HTTP $status"
        sed -n '1,80p' "$response_file" >&2 || true
        return 1
      fi

      for _ in $(seq 1 60); do
        snapshot_home_assistant_backups "$backup_dir" "$HA_BACKUPS_AFTER"
        mapfile -t new_backups < <(
          home_assistant_new_backup_files "$HA_BACKUPS_BEFORE" "$HA_BACKUPS_AFTER"
        )
        if [ "${#new_backups[@]}" -gt 0 ]; then
          [ "${#new_backups[@]}" -eq 1 ] \
            || die "Home Assistant created ${#new_backups[@]} new backup artifacts; expected exactly one"
          backup="${new_backups[0]}"
          case "$backup" in
            *.tar) ;;
            *) die "Home Assistant backup artifact is not a .tar archive: $backup" ;;
          esac
          assert_fresh_file "$backup" "Home Assistant managed backup"
          tar -tf "$backup" >/dev/null \
            || die "Home Assistant managed backup is not a readable tar archive: $backup"
          cp -- "$backup" "$HA_DUMPS/home-assistant.tar"
          assert_fresh_file "$HA_DUMPS/home-assistant.tar" \
            "canonical Home Assistant managed backup"
          log "Home Assistant backup artifact appeared and passed archive validation"
          return 0
        fi
        sleep 10
      done
      die "Home Assistant backup did not produce a new artifact within 10 minutes"
    }

    snapshot_home_assistant_backups() {
      local backup_dir="$1" output="$2"
      : >"$output"
      if [ -d "$backup_dir" ]; then
        find "$backup_dir" -maxdepth 1 -type f -print >"$output"
      fi
    }

    home_assistant_new_backup_files() {
      local before="$1" after="$2"
      # Compare names instead of mtimes. BusyBox find compares -newer at
      # whole-second precision and can miss an archive created in the same
      # second as a timestamp marker.
      awk '
        FILENAME == ARGV[1] { before[$0] = 1; next }
        !($0 in before) { print }
      ' "$before" "$after"
    }

    dump_romm() {
      log "dumping RomM MariaDB"
      local dump="$ROMM_DUMPS/romm.sql" tmp="$ROMM_DUMPS/romm.sql.tmp"
      MYSQL_PWD="$ROMM_DB_PASSWORD" mariadb-check \
        --protocol=tcp \
        -h "${ROMM_DB_HOST:-romm-mariadb.media.svc.cluster.local}" \
        -P "${ROMM_DB_PORT:-3306}" \
        -u "${ROMM_DB_USER:-romm}" \
        --check \
        --databases "${ROMM_DB_NAME:-romm}"
      MYSQL_PWD="$ROMM_DB_PASSWORD" mariadb-dump \
        --protocol=tcp \
        -h "${ROMM_DB_HOST:-romm-mariadb.media.svc.cluster.local}" \
        -P "${ROMM_DB_PORT:-3306}" \
        -u "${ROMM_DB_USER:-romm}" \
        --single-transaction \
        --quick \
        --databases "${ROMM_DB_NAME:-romm}" \
        >"$tmp"
      assert_fresh_file "$tmp" "RomM logical dump"
      grep -Eq '^CREATE TABLE ' "$tmp" \
        || die "RomM logical dump contains no CREATE TABLE statements"
      mv -- "$tmp" "$dump"
      assert_fresh_file "$dump" "RomM logical dump"
    }

    write_backup_contract() {
      local contract="$HOT_DUMPS/contract-version"
      local inventory="$HOT_DUMPS/required-sqlite-databases.txt"
      local created_at="$HOT_DUMPS/export-created-at"
      printf '%s\n' "$BACKUP_CONTRACT_VERSION" >"$contract"
      printf '%s\n' "$REQUIRED_SQLITE_DATABASES" >"$inventory"
      date -u +%Y-%m-%dT%H:%M:%SZ >"$created_at"
      assert_fresh_file "$contract" "backup contract marker"
      assert_fresh_file "$inventory" "required SQLite inventory"
      assert_fresh_file "$created_at" "export completion timestamp"
    }

    run_restic() {
      local target_tag="${RESTIC_TARGET_TAG:-nas}"
      local -a retention_args=()

      [ -n "${RESTIC_KEEP_DAILY:-}" ] && retention_args+=(--keep-daily "$RESTIC_KEEP_DAILY")
      [ -n "${RESTIC_KEEP_WEEKLY:-}" ] && retention_args+=(--keep-weekly "$RESTIC_KEEP_WEEKLY")
      [ -n "${RESTIC_KEEP_MONTHLY:-}" ] && retention_args+=(--keep-monthly "$RESTIC_KEEP_MONTHLY")
      [ "${#retention_args[@]}" -gt 0 ] || die "at least one Restic retention value is required"

      log "checking Restic repository"
      restic snapshots --host "$RESTIC_HOST" >/dev/null

      log "running Restic backup"
      restic backup \
        --host "$RESTIC_HOST" \
        --tag opt \
        --tag "$target_tag" \
        --exclude /data/opt/.snapshots \
        /data/opt \
        "$HOT_DUMPS"

      log "applying Restic retention policy"
      restic forget \
        --host "$RESTIC_HOST" \
        --tag "$target_tag" \
        "${retention_args[@]}" \
        --prune
    }

    dump_sqlite
    dump_k3s
    trigger_home_assistant_backup
    dump_romm
    write_backup_contract
    run_restic
    log "backup complete"
