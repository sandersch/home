apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-nas-backup
  namespace: monitoring
  labels:
    app.kubernetes.io/name: restic-nas-backup
spec:
  schedule: "15 3 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-nas-backup
        spec:
          restartPolicy: Never
          priorityClassName: homelab-low
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: minis
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: ghcr.io/sandersch/restic-backup:0.19.1-1@sha256:58cddae970e91cb4f8f18db69d9d7d526d1e1d803193a65afb2f7f3a43aa9097
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/backup.sh
              envFrom:
                - configMapRef:
                    name: restic-nas-config
              env:
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-nas
                      key: RESTIC_PASSWORD
                - name: HOME_ASSISTANT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: restic-nas
                      key: HOME_ASSISTANT_TOKEN
                - name: ROMM_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-nas
                      key: ROMM_DB_PASSWORD
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 0
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_OVERRIDE
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                  readOnly: true
                - name: opt
                  mountPath: /data/opt
                  readOnly: true
                - name: k3s-db
                  mountPath: /data/k3s-db
                  readOnly: true
                - name: backups
                  mountPath: /repo/nas
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-script
              configMap:
                name: restic-nas-config
                defaultMode: 0555
                items:
                  - key: backup.sh
                    path: backup.sh
            - name: opt
              hostPath:
                path: /opt
                type: Directory
            - name: k3s-db
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
            - name: backups
              hostPath:
                path: /mnt/backups
                type: Directory
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
