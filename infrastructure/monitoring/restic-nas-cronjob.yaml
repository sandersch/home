apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-nas-backup
  namespace: monitoring
  labels:
    app.kubernetes.io/name: restic-nas-backup
spec:
  schedule: "15 3 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-nas-backup
        spec:
          restartPolicy: Never
          priorityClassName: homelab-low
          containers:
            - name: restic
              image: ghcr.io/sandersch/restic-backup:0.19.0-1@sha256:2b10954ca8edd402c3168ad052a526ef559dafe4c61ad569902036021e08ca7a
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/backup.sh
              envFrom:
                - configMapRef:
                    name: restic-nas-config
              env:
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-nas
                      key: RESTIC_PASSWORD
                - name: HOME_ASSISTANT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: restic-nas
                      key: HOME_ASSISTANT_TOKEN
                - name: ROMM_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-nas
                      key: ROMM_DB_PASSWORD
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                  readOnly: true
                - name: opt
                  mountPath: /data/opt
                  readOnly: true
                - name: backups
                  mountPath: /repo/nas
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-script
              configMap:
                name: restic-nas-config
                defaultMode: 0555
                items:
                  - key: backup.sh
                    path: backup.sh
            - name: opt
              hostPath:
                path: /opt
                type: Directory
            - name: backups
              hostPath:
                path: /mnt/backups
                type: Directory
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
