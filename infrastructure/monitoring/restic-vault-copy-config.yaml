apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-vault-copy-config
  namespace: monitoring
data:
  enroll-vault-b2.sh: |
    #!/usr/bin/env bash
    # Attended B2 enrollment, executed inside the pinned Restic image.
    set -Eeuo pipefail

    log() { printf '[%s] %s\n' "$(date -Iseconds)" "$*"; }
    die() { log "ERROR: $*" >&2; exit 1; }
    restic() { command restic --no-cache "$@"; }

    [ -t 0 ] && [ -t 1 ] || die "enrollment requires an interactive kubectl exec TTY"
    [ "$(id -u)" -eq 0 ] || die "enrollment container must run as root"
    [ "$(stat -f -c '%T' /dev/shm)" = tmpfs ] || die "/dev/shm must be tmpfs"
    [ -f /data/vault/.vault-sentinel ] || die "vault sentinel is absent"
    grep -qxF 'vault-contract-version=2' /data/vault/.vault-sentinel \
      || die "vault sentinel contract mismatch"
    [ -f /repo/nas/vault/config ] || die "vault NAS repository is not initialized"
    [ -f /data/vault/.backup-credentials/nas-password ] \
      || die "vault NAS password is absent"
    [ -r /etc/homelab/vault-b2.conf ] || die "B2 repository configuration is absent"
    # shellcheck disable=SC1091
    source /etc/homelab/vault-b2.conf
    : "${VAULT_B2_REPOSITORY:?VAULT_B2_REPOSITORY is required}"

    staging="$(mktemp -d /dev/shm/vault-b2-enroll.XXXXXX)"
    trap 'rm -rf "$staging"' EXIT
    umask 077
    printf 'Enter the new vault B2 repository password: '
    read -r -s b2_password
    printf '\nConfirm the vault B2 repository password: '
    read -r -s b2_password_again
    printf '\n'
    [ -n "$b2_password" ] && [ "$b2_password" = "$b2_password_again" ] \
      || die "repository passwords differ"
    printf 'B2 application key ID: '
    read -r b2_key_id
    printf 'B2 application key secret: '
    read -r -s b2_key
    printf '\n'
    [ -n "$b2_key_id" ] && [ -n "$b2_key" ] || die "B2 key fields may not be empty"

    printf '%s\n' "$b2_password" >"$staging/password"
    printf '%s\n' "$b2_key_id" >"$staging/key-id"
    printf '%s\n' "$b2_key" >"$staging/application-key"
    unset b2_password b2_password_again b2_key_id b2_key
    AWS_ACCESS_KEY_ID="$(cat "$staging/key-id")"
    AWS_SECRET_ACCESS_KEY="$(cat "$staging/application-key")"
    export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
    export RESTIC_PASSWORD_FILE="$staging/password"

    # Record intent before contacting B2. If this process is interrupted after
    # contact, recovery must prove destination absence instead of treating the
    # host as never enrolled.
    marker_tmp="$(mktemp /etc/homelab/vault-b2.enrolled.XXXXXX)"
    chmod 0600 "$marker_tmp"
    mv -f "$marker_tmp" /etc/homelab/vault-b2.enrolled
    probe_log="$staging/repository-probe.log"
    if restic -r "$VAULT_B2_REPOSITORY" snapshots >"$probe_log" 2>&1; then
      log "B2 repository already initialized; preserving its chunker parameters"
    else
      result="$?"
      if [ "$result" -ne 10 ]; then
        cat "$probe_log" >&2
        die "cannot open B2 repository (exit $result)"
      fi
      RESTIC_FROM_PASSWORD_FILE=/data/vault/.backup-credentials/nas-password \
        restic -r "$VAULT_B2_REPOSITORY" init --from-repo /repo/nas/vault \
          --copy-chunker-params
    fi
    restic -r "$VAULT_B2_REPOSITORY" snapshots --json >/dev/null

    install -m 0600 "$staging/password" \
      /data/vault/.backup-credentials/b2-password
    install -m 0600 "$staging/key-id" \
      /data/vault/.backup-credentials/b2-key-id
    install -m 0600 "$staging/application-key" \
      /data/vault/.backup-credentials/b2-application-key
    log "vault B2 repository initialized; credentials stored inside the encrypted vault"
  detect-vault-exclusions.jq: |
    select(.message_type == "node") | .path | select(
      . == "/data/vault/.backup-credentials" or startswith("/data/vault/.backup-credentials/") or
      . == "/data/vault/.mail-credentials" or startswith("/data/vault/.mail-credentials/") or
      . == "/data/vault/inbox" or startswith("/data/vault/inbox/") or
      . == "/data/vault/.restore-tests" or startswith("/data/vault/.restore-tests/")
    )
  copy-vault.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    log() { printf '[%s] %s\n' "$(date -Iseconds)" "$*"; }
    die() { log "ERROR: $*" >&2; exit 1; }
    restic_lock_retry="${RESTIC_LOCK_RETRY:-30m}"
    restic() { command restic --retry-lock "$restic_lock_retry" "$@"; }
    source_repo=/repo/nas/vault
    control=/repo/nas/.control/vault
    destination_control=/repo/nas/.control/vault-b2
    metrics=/metrics/restic-vault-copy.prom
    work=/work

    write_metrics() {
      local locked="$1" newest="${2:-0}" copied="${3:-0}" missing="${4:-0}" size="${5:-0}"
      local tmp="${metrics}.tmp.$$" previous_success previous_newest previous_size previous_missing success hold_count enrolled_at
      previous_success=0
      previous_newest=0
      previous_size=0
      previous_missing=0
      hold_count=0
      enrolled_at=0
      if [ -f "$metrics" ]; then
        enrolled_at="$(awk '/^homelab_backup_repository_enrollment_timestamp_seconds\{/ {print $NF}' "$metrics" | tail -n1)"
        previous_success="$(awk '/homelab_restic_replication_success_timestamp_seconds/ {print $NF}' "$metrics" | tail -n1)"
        previous_newest="$(awk '/homelab_restic_destination_snapshot_timestamp_seconds/ {print $NF}' "$metrics" | tail -n1)"
        previous_size="$(awk '/homelab_restic_repository_size_bytes/ {print $NF}' "$metrics" | tail -n1)"
        previous_missing="$(awk '/homelab_restic_replication_missing_snapshots/ {print $NF}' "$metrics" | tail -n1)"
      fi
      # Enrollment age survives daily copies, locked skips, and Pod replacement.
      [ "${enrolled_at:-0}" -gt 0 ] || enrolled_at="$(date +%s)"
      [ "$newest" -gt 0 ] || newest="${previous_newest:-0}"
      [ "$size" -gt 0 ] || size="${previous_size:-0}"
      [ "$locked" -eq 1 ] && missing="${previous_missing:-0}"
      if [ -d "$destination_control/holds" ]; then
        hold_count="$(find "$destination_control/holds" -type f -name '*.json' | wc -l)"
      fi
      success="${previous_success:-0}"
      [ "$copied" -gt 0 ] && success="$(date +%s)"
      umask 0027
      {
        printf 'homelab_backup_repository_enrolled{dataset="vault",destination="b2"} 1\n'
        printf 'homelab_backup_repository_enrollment_timestamp_seconds{dataset="vault",destination="b2"} %s\n' "$enrolled_at"
        printf 'homelab_restic_replication_locked{dataset="vault",destination="b2"} %s\n' "$locked"
        printf 'homelab_restic_destination_snapshot_timestamp_seconds{dataset="vault",destination="b2"} %s\n' "$newest"
        printf 'homelab_restic_replication_success_timestamp_seconds{dataset="vault",destination="b2"} %s\n' "$success"
        printf 'homelab_restic_replication_missing_snapshots{dataset="vault",destination="b2"} %s\n' "$missing"
        printf 'homelab_restic_validation_hold{dataset="vault",destination="b2"} %s\n' "$hold_count"
        printf 'homelab_restic_repository_size_bytes{dataset="vault",destination="b2"} %s\n' "$size"
        printf 'homelab_restic_repository_ceiling_bytes{dataset="vault",destination="b2"} 100000000000\n'
      } >"$tmp"
      chmod 0640 "$tmp"
      mv -f "$tmp" "$metrics"
    }

    ledger_has() {
      local ledger="$1" lineage="$2"
      [ -f "$ledger" ] && jq -e --arg lineage "$lineage" \
        -s 'any(.[]; .lineage == $lineage)' "$ledger" >/dev/null 2>&1
    }

    lineage_held() {
      local directory="$1" lineage="$2" entry entries held_lineage
      if [ -e "$directory" ] || [ -L "$directory" ]; then
        [ -d "$directory" ] && [ ! -L "$directory" ] || die "invalid hold directory: $directory"
        entries="$(find "$directory" -name '*.json' -print)" || die "cannot inspect holds"
        while IFS= read -r entry; do
          [ -n "$entry" ] || continue
          [ -f "$entry" ] && [ ! -L "$entry" ] || die "invalid hold: $entry"
          held_lineage="$(jq -er '.lineage | strings | select(test("^[0-9a-f]{64}$"))' "$entry")" \
            || die "malformed hold: $entry"
          [ "$held_lineage" != "$lineage" ] || return 0
        done <<<"$entries"
      fi
      return 1
    }

    hold_destination() {
      local snapshot_id="$1" lineage="$2" hold_dir="$destination_control/holds"
      local hold_file hold_tmp
      hold_file="$hold_dir/$snapshot_id.json"
      hold_tmp="$hold_file.tmp.$$"
      (umask 0077; mkdir -p "$hold_dir")
      chmod 0700 "$hold_dir"
      if [ -e "$hold_file" ] || [ -L "$hold_file" ]; then
        [ -f "$hold_file" ] && [ ! -L "$hold_file" ] \
          || die "destination hold path is invalid: $hold_file"
        return 0
      fi
      jq -n \
        --arg snapshot_id "$snapshot_id" \
        --arg lineage "$lineage" \
        --arg reason destination-ledger-missing \
        --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        '{snapshot_id:$snapshot_id,lineage:$lineage,reason:$reason,created_at:$created_at}' \
        >"$hold_tmp"
      chmod 0600 "$hold_tmp"
      mv "$hold_tmp" "$hold_file"
    }

    # The encrypted vault is deliberately the credential boundary. A locked vault is
    # a successful degraded run and must not contact B2 or advance freshness.
    mount_record="$(awk '$5 == "/data/vault" { separator=0; for (field=7; field<=NF; field++) if ($field == "-") { separator=field; break }; if (separator>0) print $(separator+1) "\t" $(separator+2) }' /proc/self/mountinfo | tail -n1)"
    IFS=$'\t' read -r vault_fs vault_source <<<"$mount_record"
    if [ "$vault_fs" = ext4 ] && [ "$vault_source" = /dev/mapper/vg0-root ]; then
      write_metrics 1 0 0 0
      log "vault is locked; skipping B2 replication without opening credentials"
      exit 0
    fi
    [ "$vault_fs" = ext4 ] && [ "$vault_source" = /dev/mapper/vault ] \
      || die "/data/vault is not the configured vault filesystem"
    grep -qxF 'vault-contract-version=2' /data/vault/.vault-sentinel \
      || die "vault sentinel contract mismatch"
    [ -r /etc/homelab/vault-b2.conf ] || die "B2 repository configuration is absent"
    # shellcheck disable=SC1091
    source /etc/homelab/vault-b2.conf
    : "${VAULT_B2_REPOSITORY:?VAULT_B2_REPOSITORY is required}"
    [ -f /data/vault/.backup-credentials/nas-password ] \
      || die "vault NAS password is absent"
    [ -f /data/vault/.backup-credentials/b2-password ] \
      || die "vault B2 password is absent"
    [ -f /data/vault/.backup-credentials/b2-key-id ] \
      || die "vault B2 key ID is absent"
    [ -f /data/vault/.backup-credentials/b2-application-key ] \
      || die "vault B2 application key is absent"
    [ -f "$source_repo/config" ] || die "vault NAS repository is not initialized"

    (umask 0077; mkdir -p "$destination_control")
    chmod 0700 "$destination_control"
    mkdir -p "$work/restic-cache"
    export RESTIC_CACHE_DIR="$work/restic-cache"
    b2_key_id="$(cat /data/vault/.backup-credentials/b2-key-id)"
    b2_application_key="$(cat /data/vault/.backup-credentials/b2-application-key)"
    export AWS_ACCESS_KEY_ID="$b2_key_id"
    export AWS_SECRET_ACCESS_KEY="$b2_application_key"
    export RESTIC_REPOSITORY="$VAULT_B2_REPOSITORY"
    export RESTIC_PASSWORD_FILE=/data/vault/.backup-credentials/b2-password
    export RESTIC_FROM_REPOSITORY="$source_repo"
    export RESTIC_FROM_PASSWORD_FILE=/data/vault/.backup-credentials/nas-password

    (umask 0077; touch "$destination_control/validated.jsonl")
    chmod 0600 "$destination_control/validated.jsonl"
    source_listing="$work/source.json"
    destination_listing="$work/destination.json"
    RESTIC_PASSWORD_FILE=/data/vault/.backup-credentials/nas-password \
      restic -r "$source_repo" snapshots --host minis-vault --json >"$source_listing"
    restic snapshots --host minis-vault --json >"$destination_listing"
    source_count=0
    copied_count=0
    missing_count=0
    newest=0
    while IFS=$'\t' read -r snapshot_id lineage _snapshot_time; do
      [ -n "$snapshot_id" ] || continue
      source_count=$((source_count + 1))
      ledger_has "$control/validated.jsonl" "$lineage" \
        || { missing_count=$((missing_count + 1)); continue; }
      if lineage_held "$control/holds" "$lineage" \
        || lineage_held "$destination_control/holds" "$lineage"; then
        missing_count=$((missing_count + 1))
        continue
      fi
      resolution="$control/resolutions/$snapshot_id.json"
      if [ -e "$resolution" ] || [ -L "$resolution" ]; then
        [ -f "$resolution" ] && [ ! -L "$resolution" ] || die "invalid resolution state"
        if ! jq -e --arg id "$snapshot_id" '.snapshot_id == $id and .action == "accept" and .stage == "accepted"' "$resolution" >/dev/null; then
          missing_count=$((missing_count + 1))
          continue
        fi
      fi
      destination_id="$(jq -r --arg lineage "$lineage" '[.[] | select((.original // .id) == $lineage)] | first | .id // empty' "$destination_listing")"
      if [ -n "$destination_id" ]; then
        if ! ledger_has "$destination_control/validated.jsonl" "$lineage"; then
          log "destination snapshot $destination_id lacks validation evidence; holding replication"
          hold_destination "$destination_id" "$lineage"
          missing_count=$((missing_count + 1))
          continue
        fi
        current_time="$(jq -L /vault-scripts -er --arg id "$destination_id" 'include "snapshot-time"; .[] | select(.id == $id) | .time | snapshot_epoch' "$destination_listing" | head -n1)"
        [ "$current_time" -gt "$newest" ] && newest="$current_time"
        continue
      else
        log "copying source snapshot $snapshot_id (lineage $lineage)"
        export RESTIC_REPOSITORY="$source_repo"
        export RESTIC_PASSWORD_FILE=/data/vault/.backup-credentials/nas-password
        /vault-scripts/validate-vault-snapshot.sh "$snapshot_id" >/dev/null \
          || die "source snapshot $snapshot_id failed revalidation"
        export RESTIC_REPOSITORY="$VAULT_B2_REPOSITORY"
        export RESTIC_PASSWORD_FILE=/data/vault/.backup-credentials/b2-password
        RESTIC_PASSWORD_FILE=/data/vault/.backup-credentials/b2-password \
          RESTIC_FROM_PASSWORD_FILE=/data/vault/.backup-credentials/nas-password \
          restic copy --from-repo "$source_repo" "$snapshot_id" >/dev/null
        copied_count=$((copied_count + 1))
        restic snapshots --host minis-vault --json >"$destination_listing"
        destination_id="$(jq -r --arg lineage "$lineage" '[.[] | select((.original // .id) == $lineage)] | first | .id // empty' "$destination_listing")"
        [ -n "$destination_id" ] || die "copy returned no destination snapshot for $lineage"
      fi

      export RESTIC_REPOSITORY="$VAULT_B2_REPOSITORY"
      /vault-scripts/validate-vault-snapshot.sh "$destination_id" >/dev/null
      printf '%s\n' "$(jq -cn --arg lineage "$lineage" --arg snapshot_id "$destination_id" --arg validated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{lineage:$lineage,snapshot_id:$snapshot_id,validated_at:$validated_at}')" \
        >>"$destination_control/validated.jsonl"
      current_time="$(jq -L /vault-scripts -er --arg id "$destination_id" 'include "snapshot-time"; .[] | select(.id == $id) | .time | snapshot_epoch' "$destination_listing" | head -n1)"
      [ "$current_time" -gt "$newest" ] && newest="$current_time"
    done < <(jq -r '.[] | select(.hostname == "minis-vault") | [.id, (.original // .id), (.time // "1970-01-01T00:00:00Z")] | @tsv' "$source_listing")

    [ "$source_count" -gt 0 ] || die "vault NAS repository has no snapshots"
    destination_size="$(restic stats --json --mode raw-data | jq -er '.total_size // 0')"
    write_metrics 0 "$newest" "$copied_count" "$missing_count" "$destination_size"
    if [ "$missing_count" -gt 0 ]; then
      log "$missing_count vault snapshot(s) were not eligible for replication; newer eligible lineages were processed"
      exit 0
    fi
    log "vault B2 replication complete; copied $copied_count snapshot(s)"
  resolve-vault-b2-validation-hold.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    log() { printf '[%s] %s\n' "$(date -Iseconds)" "$*"; }
    die() { log "ERROR: $*" >&2; exit 1; }
    restic_lock_retry="${RESTIC_LOCK_RETRY:-30m}"
    restic() { command restic --retry-lock "$restic_lock_retry" "$@"; }

    : "${B2_HOLD_SNAPSHOT:?B2_HOLD_SNAPSHOT is required}"
    : "${HOLD_OPERATOR:?HOLD_OPERATOR is required}"
    [[ "$B2_HOLD_SNAPSHOT" =~ ^[0-9a-f]{64}$ ]] \
      || die "B2_HOLD_SNAPSHOT must be a full 64-character lowercase ID"

    [ -r /etc/homelab/vault-b2.conf ] || die "B2 repository configuration is absent"
    # shellcheck disable=SC1091
    source /etc/homelab/vault-b2.conf
    : "${VAULT_B2_REPOSITORY:?VAULT_B2_REPOSITORY is required}"
    grep -qxF 'vault-contract-version=2' /data/vault/.vault-sentinel \
      || die "vault sentinel contract mismatch"
    for credential in b2-password b2-key-id b2-application-key; do
      path="/data/vault/.backup-credentials/$credential"
      [ -f "$path" ] && [ ! -L "$path" ] && [ -s "$path" ] \
        || die "$path is absent, empty, or a symlink"
    done

    destination_control=/repo/nas/.control/vault-b2
    hold="$destination_control/holds/$B2_HOLD_SNAPSHOT.json"
    [ -f "$hold" ] && [ ! -L "$hold" ] || die "the exact B2 hold is absent"
    hold_snapshot="$(jq -er '.snapshot_id' "$hold")"
    hold_lineage="$(jq -er '.lineage' "$hold")"
    [ "$hold_snapshot" = "$B2_HOLD_SNAPSHOT" ] \
      || die "B2 hold names a different snapshot"

    b2_key_id="$(cat /data/vault/.backup-credentials/b2-key-id)"
    b2_application_key="$(cat /data/vault/.backup-credentials/b2-application-key)"
    export AWS_ACCESS_KEY_ID="$b2_key_id"
    export AWS_SECRET_ACCESS_KEY="$b2_application_key"
    export RESTIC_REPOSITORY="$VAULT_B2_REPOSITORY"
    export RESTIC_PASSWORD_FILE=/data/vault/.backup-credentials/b2-password
    mkdir -p /work/restic-cache
    export RESTIC_CACHE_DIR=/work/restic-cache

    metadata="$(restic snapshots "$B2_HOLD_SNAPSHOT" --host minis-vault --json)"
    [ "$(jq 'length' <<<"$metadata")" -eq 1 ] \
      || die "the held B2 snapshot is not present exactly once"
    actual_lineage="$(jq -er '.[0] | .original // .id' <<<"$metadata")"
    [ "$actual_lineage" = "$hold_lineage" ] \
      || die "held B2 snapshot lineage differs from its hold"

    /vault-scripts/validate-vault-snapshot.sh "$B2_HOLD_SNAPSHOT" \
      >/work/b2-held-manifest.json \
      || die "held B2 snapshot failed attended content validation"

    ledger="$destination_control/validated.jsonl"
    [ -f "$ledger" ] || : >"$ledger"
    jq -s -e 'all(.[]; type == "object" and (.lineage | type == "string") and (.snapshot_id | type == "string"))' \
      "$ledger" >/dev/null \
      || die "B2 validation ledger is malformed"
    if ! jq -s -e --arg lineage "$hold_lineage" 'any(.[]; .lineage == $lineage)' "$ledger" >/dev/null; then
      printf '%s\n' "$(jq -cn \
        --arg lineage "$hold_lineage" \
        --arg snapshot_id "$B2_HOLD_SNAPSHOT" \
        --arg validated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --arg operator "$HOLD_OPERATOR" \
        '{lineage:$lineage,snapshot_id:$snapshot_id,validated_at:$validated_at,operator:$operator}')" \
        >>"$ledger"
    fi

    rm -f -- "$hold"
    hold_count="$(find "$destination_control/holds" -type f -name '*.json' | wc -l)"
    metric=/metrics/restic-vault-copy.prom
    [ -f "$metric" ] || die "B2 replication metric is absent"
    metric_tmp="${metric}.tmp.$$"
    awk -v count="$hold_count" '
      /^homelab_restic_validation_hold\{dataset="vault",destination="b2"\}/ {
        print "homelab_restic_validation_hold{dataset=\"vault\",destination=\"b2\"} " count
        replaced = 1
        next
      }
      { print }
      END {
        if (!replaced) print "homelab_restic_validation_hold{dataset=\"vault\",destination=\"b2\"} " count
      }
    ' "$metric" >"$metric_tmp"
    chmod 0640 "$metric_tmp"
    mv -f "$metric_tmp" "$metric"
    log "revalidated B2 snapshot $B2_HOLD_SNAPSHOT for lineage $hold_lineage; $hold_count destination hold(s) remain"
  validate-vault-b2-restore.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    log() { printf '[%s] %s\n' "$(date -Iseconds)" "$*"; }
    die() { log "ERROR: $*" >&2; exit 1; }
    restic_lock_retry="${RESTIC_LOCK_RETRY:-30m}"
    restic() { command restic --retry-lock "$restic_lock_retry" "$@"; }
    : "${RESTORE_SNAPSHOT:?RESTORE_SNAPSHOT is required}"
    [[ "$RESTORE_SNAPSHOT" =~ ^[0-9a-f]{64}$ ]] || die "RESTORE_SNAPSHOT must be a full snapshot ID"
    mount_record="$(awk '$5 == "/data/vault" {for (i=7;i<=NF;i++) if ($i == "-") print $(i+1) " " $(i+2)}' /proc/self/mountinfo)"
    [ "$mount_record" = 'ext4 /dev/mapper/vault' ] || die "vault is not mounted"
    # shellcheck disable=SC1091
    source /etc/homelab/vault.conf
    grep -qxF "filesystem-uuid=$VAULT_FS_UUID" /data/vault/.vault-sentinel || die "vault UUID mismatch"
    [ -r /etc/homelab/vault-b2.conf ] || die "B2 repository configuration is absent"
    # shellcheck disable=SC1091
    source /etc/homelab/vault-b2.conf
    : "${VAULT_B2_REPOSITORY:?VAULT_B2_REPOSITORY is required}"
    grep -qxF 'vault-contract-version=2' /data/vault/.vault-sentinel \
      || die "vault sentinel contract mismatch"
    export RESTIC_REPOSITORY="$VAULT_B2_REPOSITORY"
    export RESTIC_PASSWORD_FILE=/data/vault/.backup-credentials/b2-password
    b2_key_id="$(cat /data/vault/.backup-credentials/b2-key-id)"
    b2_application_key="$(cat /data/vault/.backup-credentials/b2-application-key)"
    export AWS_ACCESS_KEY_ID="$b2_key_id"
    export AWS_SECRET_ACCESS_KEY="$b2_application_key"
    mkdir -p /work/restic-cache
    export RESTIC_CACHE_DIR=/work/restic-cache
    umask 0077
    [ ! -L /data/vault/.restore-tests ] || die "restore directory is a symlink"
    mkdir -p /data/vault/.restore-tests
    restore_root="$(mktemp -d "/data/vault/.restore-tests/b2-$RESTORE_SNAPSHOT.XXXXXX")"
    restic check --read-data
    /vault-scripts/validate-vault-snapshot.sh "$RESTORE_SNAPSHOT" >/work/validated-manifest.json
    listing=/work/listing.jsonl
    restic ls --json "$RESTORE_SNAPSHOT" >"$listing"
    kdbx="$restore_root/ccs.kdbx"
    restic dump "$RESTORE_SNAPSHOT" /data/vault/credentials/strongbox/ccs.kdbx >"$kdbx"
    [ "$(od -An -tx1 -N8 "$kdbx" | tr -d ' \n')" = 03d9a29a67fb4bb5 ] \
      || die "B2 restore returned an invalid KDBX"
    document="$(jq -nr --arg requested "${RESTORE_DOCUMENT_PATH:-}" 'first(inputs | select(.message_type == "node" and .type == "file" and (.path | startswith("/data/vault/documents/")) and ($requested == "" or .path == $requested)) | .path)' "$listing")"
    photo="$(jq -nr --arg requested "${RESTORE_PHOTO_PATH:-}" 'first(inputs | select(.message_type == "node" and .type == "file" and (.path | startswith("/data/vault/photos/")) and ($requested == "" or .path == $requested)) | .path)' "$listing")"
    [ -n "$document" ] && [ -n "$photo" ] || die "B2 snapshot has no representative document or photo"
    restic dump "$RESTORE_SNAPSHOT" "$document" >"$restore_root/document-$(basename "$document")"
    restic dump "$RESTORE_SNAPSHOT" "$photo" >"$restore_root/photo-$(basename "$photo")"
    [ -s "$restore_root/document-$(basename "$document")" ] && [ -s "$restore_root/photo-$(basename "$photo")" ] \
      || die "B2 representative restore produced an empty file"
    printf '%s\n' "$RESTORE_SNAPSHOT" "$document" "$photo" >"$restore_root/restore-evidence.txt"
    log "B2 data check and representative extraction passed; inspect host ${restore_root/\/data\/vault/\/mnt\/vault} before recording semantic success"
