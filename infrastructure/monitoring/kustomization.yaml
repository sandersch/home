apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- workstations
- restic-mount-guard.yaml
- restic-nas-config.yaml
- restic-nas-cronjob.yaml
- restic-nas.sops.yaml
- restic-b2-cronjob.yaml
- restic-b2.sops.yaml
- restic-vault-config.yaml
- restic-vault-cronjob.yaml
- restic-vault-copy-config.yaml
- restic-vault-copy-cronjob.yaml
- restic-vault-prune-config.yaml
- restic-vault-prune-cronjob.yaml
- restic-verify-config.yaml
- restic-verify-cronjob.yaml
configMapGenerator:
- name: restic-vault-contract
  namespace: monitoring
  files:
  - vault-v1.json=contracts/vault-v1.json
  - vault-v1.excludes=contracts/vault-v1.excludes
  - vault-v2.json=contracts/vault-v2.json
  - vault-v2.excludes=contracts/vault-v2.excludes
generatorOptions:
  disableNameSuffixHash: true
