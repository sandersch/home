apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-verify
  namespace: monitoring
  labels:
    app.kubernetes.io/name: restic-verify
spec:
  schedule: "30 0 15 * *"
  timeZone: America/Chicago
  suspend: true
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 43200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-verify
        spec:
          restartPolicy: Never
          priorityClassName: homelab-low
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: minis
          securityContext:
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: ghcr.io/sandersch/restic-backup:0.19.1-1@sha256:58cddae970e91cb4f8f18db69d9d7d526d1e1d803193a65afb2f7f3a43aa9097
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/verify.sh
              env:
                - name: APPSTATE_NAS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-nas
                      key: RESTIC_PASSWORD
                - name: APPSTATE_B2_REPOSITORY
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: RESTIC_REPOSITORY
                - name: APPSTATE_B2_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 0
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_OVERRIDE
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: guard
                  mountPath: /guards
                  readOnly: true
                - name: host-config
                  mountPath: /host-config/vault.conf
                  readOnly: true
                - name: vault
                  mountPath: /data/vault
                  readOnly: true
                - name: backups
                  mountPath: /repo/nas
                - name: metrics
                  mountPath: /metrics
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: restic-verify-config
                defaultMode: 0555
            - name: guard
              configMap:
                name: restic-mount-guard
                defaultMode: 0555
            - name: host-config
              hostPath:
                path: /etc/homelab/vault.conf
                type: File
            - name: vault
              hostPath:
                path: /mnt/vault
                type: Directory
            - name: backups
              hostPath:
                path: /mnt/backups
                type: Directory
            - name: metrics
              hostPath:
                path: /var/lib/node-exporter/textfile
                type: Directory
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
