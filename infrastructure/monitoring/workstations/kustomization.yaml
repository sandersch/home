# Active via ../kustomization.yaml; its CronJobs stay suspended until the recovery gates pass.
# Each contract release adds its .json and .excludes to restic-workstation-contracts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rbac.yaml
- ryze.sops.yaml
- m5c.sops.yaml
- ryze-server.yaml
- m5c-server.yaml
- ryze-jobs.yaml
- m5c-jobs.yaml
- alerts.yaml
configMapGenerator:
- name: restic-workstation-scripts
  namespace: monitoring
  files:
  - maintenance.py
  - server.py
  - workstation.py
- name: restic-workstation-contracts
  namespace: monitoring
  files:
  # Every released version stays mapped so historical snapshots keep validating.
  - workstation-ryze-v1.json=contracts/workstation-ryze-v1.json
  - workstation-ryze-v1.excludes=contracts/workstation-ryze-v1.excludes
  - workstation-ryze-v2.json=contracts/workstation-ryze-v2.json
  - workstation-ryze-v2.excludes=contracts/workstation-ryze-v2.excludes
  - workstation-m5c-v1.json=contracts/workstation-m5c-v1.json
  - workstation-m5c-v1.excludes=contracts/workstation-m5c-v1.excludes
generatorOptions:
  disableNameSuffixHash: true
