apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-m5c
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: restic-m5c
  template:
    metadata:
      labels:
        app: restic-m5c
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-low
      nodeSelector:
        kubernetes.io/hostname: minis
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: binary
        image: restic/rest-server:0.14.0@sha256:e117e428e511e3ffdeb6d0e578adf4b468803c77ad500993bb8f15038b2d9db3
        command: ["/bin/sh", "-ec", "cp /usr/bin/rest-server /tools/rest-server"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: tools, mountPath: /tools}
      containers:
      - name: server
        image: python:3.13.7-alpine3.22@sha256:527c28b29498575b851ad88e7522ac7201bbd9e920d2c11b00ff2b39b315f5f8
        command: ["python3", "/scripts/server.py"]
        env:
        - {name: WORKSTATION_HOST, value: m5c}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        ports:
        - {name: http, containerPort: 8000}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        startupProbe:
          tcpSocket: {port: http}
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          exec:
            command: ["python3", "/scripts/maintenance.py", "guard"]
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket: {port: http}
          periodSeconds: 10
        volumeMounts:
        - {name: tools, mountPath: /tools, readOnly: true}
        - {name: scripts, mountPath: /scripts, readOnly: true}
        - {name: mount-identity, mountPath: /repo/nas, readOnly: true}
        - {name: repository, mountPath: /repository}
        - {name: authentication, mountPath: /authentication, readOnly: true}
      volumes:
      - name: tools
        emptyDir: {}
      - name: scripts
        configMap: {name: restic-workstation-scripts}
      - name: mount-identity
        hostPath: {path: /mnt/backups, type: Directory}
      - name: repository
        hostPath: {path: /mnt/backups/workstations/m5c, type: Directory}
      - name: authentication
        secret:
          secretName: restic-workstation-m5c
          defaultMode: 0440
          items:
          - {key: htpasswd, path: htpasswd}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: restic-m5c
  namespace: monitoring
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: restic-m5c
---
apiVersion: v1
kind: Service
metadata:
  name: restic-m5c
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: restic-m5c
  ports:
  - {name: http, port: 8000, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restic-m5c
  namespace: monitoring
spec:
  ingressClassName: tailscale
  tls:
  - hosts: [restic-m5c]
  defaultBackend:
    service:
      name: restic-m5c
      port: {number: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restic-m5c
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: restic-m5c
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
      podSelector:
        matchLabels:
          tailscale.com/parent-resource: restic-m5c
          tailscale.com/parent-resource-ns: monitoring
          tailscale.com/parent-resource-type: ingress
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          worm.run/workstation-maintenance: m5c
    ports:
    - {protocol: TCP, port: 8000}
