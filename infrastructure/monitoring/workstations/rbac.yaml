apiVersion: v1
kind: ServiceAccount
metadata:
  name: restic-workstation-maintenance
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restic-workstation-recount
  namespace: monitoring
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [restic-ryze, restic-m5c]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restic-workstation-recount
  namespace: monitoring
subjects:
- kind: ServiceAccount
  name: restic-workstation-maintenance
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restic-workstation-recount
