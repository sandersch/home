apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: critical-ingress
  namespace: monitoring
spec:
  interval: 30s
  jobName: blackbox-critical-ingress
  module: http_2xx
  prober:
    path: /probe
    scheme: http
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  scrapeTimeout: 10s
  targets:
    staticConfig:
      labels:
        probe_scope: ingress
        service_tier: critical
      static:
        - https://home-assistant.worm.run
        - https://frigate.worm.run
        - https://zigbee2mqtt.worm.run
---
