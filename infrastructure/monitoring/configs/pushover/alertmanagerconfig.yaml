apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: pushover
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-monitoring
spec:
  route:
    groupBy:
      - namespace
      - alertname
    groupInterval: 5m
    groupWait: 30s
    matchers:
      - matchType: "!="
        name: alertname
        value: Watchdog
      - matchType: "=~"
        name: severity
        value: ^(warning|critical)$
    receiver: pushover-warning
    repeatInterval: 12h
    routes:
      - matchers:
          - matchType: "="
            name: severity
            value: critical
        receiver: pushover-critical
  # The message lists firing and resolved alerts in separate sections. When
  # every alert in the group shares a summary (the usual case, since groups
  # are per alertname), it is printed once and each line carries only the
  # description, which keeps multi-object groups under Pushover's
  # 1,024-character message limit.
  receivers:
    - name: pushover-warning
      pushoverConfigs:
        - message: |-
            {{- $common := .CommonAnnotations.summary -}}
            {{- with .Alerts.Firing }}Firing{{ with $common }}: {{ . }}{{ end }}
            {{- range . }}
            - {{ if or (not $common) (not .Annotations.description) }}{{ .Annotations.summary }}{{ with .Annotations.description }}: {{ end }}{{ end }}{{ .Annotations.description }}{{ with .Labels.namespace }} [{{ . }}]{{ end }}{{ with .Labels.instance }} ({{ . }}){{ end }}
            {{- end }}{{ end }}
            {{- with .Alerts.Resolved }}{{ if $.Alerts.Firing }}
            {{ end }}Resolved{{ if not $.Alerts.Firing }}{{ with $common }}: {{ . }}{{ end }}{{ end }}
            {{- range . }}
            - {{ if or (not $common) (not .Annotations.description) }}{{ .Annotations.summary }}{{ with .Annotations.description }}: {{ end }}{{ end }}{{ .Annotations.description }}{{ with .Labels.namespace }} [{{ . }}]{{ end }}{{ with .Labels.instance }} ({{ . }}){{ end }}
            {{- end }}{{ end }}
          priority: '{{ if eq .Status "firing" }}0{{ else }}-1{{ end }}'
          sendResolved: true
          title: '{{ .Status }} [{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}'
          token:
            key: api-token
            name: pushover
          url: https://grafana.worm.run
          urlTitle: Open Grafana
          userKey:
            key: user-key
            name: pushover
    - name: pushover-critical
      pushoverConfigs:
        - message: |-
            {{- $common := .CommonAnnotations.summary -}}
            {{- with .Alerts.Firing }}Firing{{ with $common }}: {{ . }}{{ end }}
            {{- range . }}
            - {{ if or (not $common) (not .Annotations.description) }}{{ .Annotations.summary }}{{ with .Annotations.description }}: {{ end }}{{ end }}{{ .Annotations.description }}{{ with .Labels.namespace }} [{{ . }}]{{ end }}{{ with .Labels.instance }} ({{ . }}){{ end }}
            {{- end }}{{ end }}
            {{- with .Alerts.Resolved }}{{ if $.Alerts.Firing }}
            {{ end }}Resolved{{ if not $.Alerts.Firing }}{{ with $common }}: {{ . }}{{ end }}{{ end }}
            {{- range . }}
            - {{ if or (not $common) (not .Annotations.description) }}{{ .Annotations.summary }}{{ with .Annotations.description }}: {{ end }}{{ end }}{{ .Annotations.description }}{{ with .Labels.namespace }} [{{ . }}]{{ end }}{{ with .Labels.instance }} ({{ . }}){{ end }}
            {{- end }}{{ end }}
          priority: '{{ if eq .Status "firing" }}1{{ else }}-1{{ end }}'
          sendResolved: true
          title: '{{ .Status }} [{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}'
          token:
            key: api-token
            name: pushover
          url: https://grafana.worm.run
          urlTitle: Open Grafana
          userKey:
            key: user-key
            name: pushover
