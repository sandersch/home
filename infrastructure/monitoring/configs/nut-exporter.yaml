apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nut-exporter
    app.kubernetes.io/part-of: homelab-monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nut-exporter
        app.kubernetes.io/part-of: homelab-monitoring
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: homelab-standard
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nut-exporter
          image: ghcr.io/druggeri/nut_exporter:3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
          imagePullPolicy: IfNotPresent
          env:
            - name: NUT_EXPORTER_SERVER
              value: 10.137.20.5
            - name: NUT_EXPORTER_SERVERPORT
              value: "3493"
            - name: NUT_EXPORTER_VARIABLES
              value: battery.charge,battery.charge.low,battery.charge.warning,battery.runtime,battery.runtime.low,battery.voltage,battery.voltage.nominal,input.transfer.high,input.transfer.low,input.voltage,input.voltage.nominal,output.voltage,ups.load,ups.realpower.nominal,ups.status
          ports:
            - name: http
              containerPort: 9199
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nut-exporter
    app.kubernetes.io/part-of: homelab-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nut-exporter
  ports:
    - name: http
      port: 9199
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nut-exporter
    app.kubernetes.io/part-of: homelab-monitoring
spec:
  endpoints:
    - port: http
      path: /ups_metrics
      interval: 30s
      scrapeTimeout: 10s
      params:
        ups:
          - cp1500
      relabelings:
        - sourceLabels:
            - __param_ups
          targetLabel: ups
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-exporter
