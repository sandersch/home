apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
spec:
  groups:
    - name: homelab.blackbox
      rules:
        - alert: CriticalEndpointDown
          expr: probe_success{service_tier="critical"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            description: "{{ $labels.instance }} has failed its blackbox probe for at least three minutes."
            summary: Critical endpoint is unavailable
        - alert: StandardEndpointDown
          expr: probe_success{service_tier="standard"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            description: "{{ $labels.instance }} has failed its blackbox probe for at least ten minutes."
            summary: Standard endpoint is unavailable
        - alert: IngressCertificateExpiringSoon
          expr: (probe_ssl_earliest_cert_expiry{probe_scope="ingress"} - time() < 14 * 24 * 60 * 60) and probe_ssl_earliest_cert_expiry{probe_scope="ingress"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            description: "The TLS certificate seen at {{ $labels.instance }} expires in less than 14 days."
            summary: Ingress certificate is close to expiry
    - name: homelab.zigbee2mqtt
      rules:
        - alert: Zigbee2MQTTBridgeUnhealthy
          expr: |
            max(
              (mqtt_state{topic="zigbee2mqtt_bridge_state"} == 0)
              or (mqtt_mqtt_connected{topic="zigbee2mqtt_bridge_health"} == 0)
              or (
                time() - mqtt_response_time{topic="zigbee2mqtt_bridge_health"} / 1000
                  > 5 * 60
              )
              or (
                absent(mqtt_response_time{topic="zigbee2mqtt_bridge_health"})
                and on()
                  kube_deployment_status_replicas_available{
                    namespace="zigbee2mqtt",
                    deployment="zigbee2mqtt-mqtt-exporter"
                  } > 0
              )
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            description: Zigbee2MQTT reports an offline bridge or disconnected MQTT client, or its one-minute health publication has been missing or stale for at least five minutes.
            summary: Zigbee2MQTT bridge health is degraded
    - name: homelab.backups
      rules:
        - alert: ResticBackupFailed
          expr: |
            max by (namespace, owner_name) (
              (
                kube_job_created{namespace="monitoring",job_name=~"restic-(nas-backup|b2-backup|vault-backup)-.*"}
                * on (namespace, job_name) group_left(owner_name)
                  kube_job_owner{namespace="monitoring",owner_kind="CronJob",owner_is_controller="true",owner_name=~"restic-(nas-backup|b2-backup|vault-backup)"}
              )
              and on (namespace, job_name)
                (kube_job_status_failed{namespace="monitoring",job_name=~"restic-(nas-backup|b2-backup|vault-backup)-.*"} > 0)
            )
            > on (namespace, owner_name)
            label_replace(
              kube_cronjob_status_last_successful_time{namespace="monitoring",cronjob=~"restic-(nas-backup|b2-backup|vault-backup)"},
              "owner_name", "$1", "cronjob", "(.*)"
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            description: "{{ $labels.owner_name }} has a failed run newer than its last successful run."
            summary: Restic backup job failed
        - alert: ResticLocalBackupOverdue
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="monitoring",cronjob="restic-nas-backup"} > 30 * 60 * 60)
            or absent(kube_cronjob_status_last_successful_time{namespace="monitoring",cronjob="restic-nas-backup"})
          for: 15m
          labels:
            severity: critical
          annotations:
            description: The nightly direct-array Restic CronJob has no successful run in the last 30 hours.
            summary: Local Restic backup is overdue
        - alert: ResticB2BackupOverdue
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="monitoring",cronjob="restic-b2-backup"} > 8 * 24 * 60 * 60)
            or absent(kube_cronjob_status_last_successful_time{namespace="monitoring",cronjob="restic-b2-backup"})
          for: 30m
          labels:
            severity: critical
          annotations:
            description: The weekly B2 Restic CronJob has no successful run in the last eight days.
            summary: B2 Restic backup is overdue
        - alert: ResticBackupSuspended
          expr: |
            kube_cronjob_spec_suspend{namespace="monitoring",cronjob=~"restic-(nas|b2)-backup"} == 1
            or (
              kube_cronjob_spec_suspend{namespace="monitoring",cronjob=~"restic-(vault-backup|verify)"} == 1
              and on() (homelab_backup_repository_enrolled{dataset="vault",destination="nas"} == 1)
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            description: "{{ $labels.cronjob }} is suspended."
            summary: Restic backup schedule is suspended
        - alert: ResticVaultBackupOverdue
          expr: |
            (
              (time() - homelab_restic_destination_snapshot_timestamp_seconds{dataset="vault",destination="nas"} > 8 * 60 * 60)
              or absent(homelab_restic_destination_snapshot_timestamp_seconds{dataset="vault",destination="nas"})
            )
            and on() (homelab_backup_repository_enrolled{dataset="vault",destination="nas"} == 1)
            and on() (node_filesystem_size_bytes{device="/dev/mapper/vault",fstype="ext4",mountpoint="/mnt/vault"} > 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            description: The mounted encrypted vault has no validated local snapshot newer than eight hours.
            summary: Vault backup is overdue
        - alert: ResticSnapshotValidationHeld
          expr: homelab_restic_validation_hold{dataset="vault",destination="nas"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            description: A vault snapshot failed validation and is held outside the replication and retention ledgers.
            summary: Vault snapshot validation is held
        - alert: ResticRepoNearCeiling
          expr: |
            homelab_restic_repository_size_bytes{dataset="vault",destination="nas"}
            / homelab_restic_repository_ceiling_bytes{dataset="vault",destination="nas"} > 0.80
          for: 30m
          labels:
            severity: warning
          annotations:
            description: The local vault repository is above 80 percent of its 250 GiB policy ceiling.
            summary: Vault repository is near its ceiling
        - alert: ResticRepositoryCheckOverdue
          expr: |
            (
              (time() - homelab_restic_repository_check_timestamp_seconds{dataset="appstate",destination=~"nas|b2"} > 40 * 24 * 60 * 60)
              or absent(homelab_restic_repository_check_timestamp_seconds{dataset="appstate",destination="nas"})
              or absent(homelab_restic_repository_check_timestamp_seconds{dataset="appstate",destination="b2"})
            )
            or (
              (
                (time() - homelab_restic_repository_check_timestamp_seconds{dataset="vault",destination="nas"} > 40 * 24 * 60 * 60)
                or absent(homelab_restic_repository_check_timestamp_seconds{dataset="vault",destination="nas"})
              )
              and on() (homelab_backup_repository_enrolled{dataset="vault",destination="nas"} == 1)
              and on() (node_filesystem_size_bytes{device="/dev/mapper/vault",fstype="ext4",mountpoint="/mnt/vault"} > 0)
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            description: "{{ $labels.dataset }}/{{ $labels.destination }} has no successful structural and rotating data check in 40 days."
            summary: Restic repository check is overdue
        - alert: ResticRestoreDrillOverdue
          expr: |
            (
              (time() - homelab_restic_restore_drill_timestamp_seconds{dataset="vault",destination="nas"} > 100 * 24 * 60 * 60)
              or absent(homelab_restic_restore_drill_timestamp_seconds{dataset="vault",destination="nas"})
            )
            and on() (homelab_backup_repository_enrolled{dataset="vault",destination="nas"} == 1)
            and on() (node_filesystem_size_bytes{device="/dev/mapper/vault",fstype="ext4",mountpoint="/mnt/vault"} > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            description: The mounted vault repository has no recorded semantic restore drill in 100 days.
            summary: Vault restore drill is overdue
        - alert: StrongboxVaultIngestionStale
          expr: |
            (
              (time() - homelab_vault_ingestion_timestamp_seconds{kind="strongbox",host="ryze",stage="promotion"} > 36 * 60 * 60)
              or absent(homelab_vault_ingestion_timestamp_seconds{kind="strongbox",host="ryze",stage="promotion"})
            )
            and on() (homelab_backup_repository_enrolled{dataset="vault",destination="nas"} == 1)
            and on() (node_filesystem_size_bytes{device="/dev/mapper/vault",fstype="ext4",mountpoint="/mnt/vault"} > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            description: ryze has not successfully offered and promoted ccs.kdbx into the mounted vault in 36 hours.
            summary: Strongbox vault ingestion is stale
    - name: homelab.ups
      rules:
        - alert: UPSOnBattery
          expr: network_ups_tools_ups_status{ups="cp1500",flag="OB"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            description: "UPS {{ $labels.ups }} has been running on battery for at least one minute."
            summary: UPS is running on battery
    - name: homelab.nfs
      rules:
        # nfsd is loaded but serving nothing. Distinct from the blackbox 2049 probe,
        # which also fires on a network-path failure; this one is specifically the daemon.
        #
        # Deliberately NOT `absent(node_nfsd_server_threads) or ... == 0`. The nfsd module
        # stays loaded across `systemctl stop nfs-server` (ExecStop is `rpc.nfsd 0`), so a
        # real outage leaves the series present and reading 0 and still fires here. An
        # absent series instead means the module was never loaded -- a host that has not
        # run runbooks/nfs-exports/ at all -- and on a rebuild that state can last hours.
        # Alerting on it paged three times during every recovery. The never-started case
        # is covered by the blackbox probe (StandardEndpointDown, 10m).
        #
        # This rests on the module staying loaded across a stop. `NFS_ALERT_DRILL=1
        # runbooks/nfs-exports/04-validate-monitoring.sh` proves it end to end; if that
        # drill ever fails to see this alert fire, restore the absent() arm.
        - alert: NFSServerDown
          expr: node_nfsd_server_threads == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            description: nfsd on minis is not running, so the /mnt/media and /mnt/games exports are unavailable.
            summary: NFS server is down
        # Invariant check: the exports are NFSv4-only (nfs.conf.d/10-homelab.conf sets
        # vers2/vers3 = n). Any v2/v3 request actually served means that lockdown
        # regressed -- most likely a stock nfs.conf or package upgrade overwrote it.
        - alert: NFSLegacyVersionServed
          expr: sum(increase(node_nfsd_requests_total{proto!="4"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            description: minis served an NFSv2 or NFSv3 request; the NFSv4-only configuration has regressed.
            summary: NFS server answered a pre-v4 request
        # Without this, a broken collector makes both alerts above silently vacuous
        # rather than firing -- NFSServerDown in particular now treats an absent series
        # as "not deployed", so a collector that breaks while NFS is up would disarm it
        # silently. The absent() arm is the load-bearing half: a disabled or renamed
        # collector emits no series at all, and a bare `== 0` would then match nothing.
        #
        # The probe gate is what makes that safe. On a host with no nfsd the collector
        # reports a hard failure, not no-data -- measured on this cluster: 0, with
        # node_nfsd_server_threads absent -- so an ungated rule fires on every host that
        # has not run runbooks/nfs-exports/. Requiring probe_success means "TCP 2049
        # answers, so NFS is deployed and up, yet its stats are unreadable", which is the
        # only state worth paging for. It is correctly silent both before deployment and
        # during a real outage, when NFSServerDown and StandardEndpointDown own the page.
        - alert: NFSDCollectorFailing
          expr: |
            (
              absent(node_scrape_collector_success{collector="nfsd"})
              or node_scrape_collector_success{collector="nfsd"} == 0
            )
            and on() probe_success{probe_scope="nfs"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            description: node-exporter cannot read /proc/net/rpc/nfsd, so the NFS server alerts cannot evaluate.
            summary: node-exporter nfsd collector is failing

    - name: homelab.node-and-apps
      rules:
        - alert: OptFilesystemFillingUp
          expr: node_filesystem_avail_bytes{mountpoint="/opt"} / node_filesystem_size_bytes{mountpoint="/opt"} < 0.20
          for: 30m
          labels:
            severity: warning
          annotations:
            description: Less than 20 percent of /opt is available on minis.
            summary: Local app-state filesystem is filling up
        - alert: BackupsVolumeFillingUp
          expr: |
            node_filesystem_avail_bytes{device="/dev/mapper/hoardvg-backuplv",mountpoint="/mnt/backups"}
            / node_filesystem_size_bytes{device="/dev/mapper/hoardvg-backuplv",mountpoint="/mnt/backups"} < 0.20
          for: 30m
          labels:
            severity: warning
          annotations:
            description: Less than 20 percent of the direct backup filesystem is available on minis.
            summary: Backup filesystem is filling up
        - alert: BackupsVolumeNearlyFull
          expr: |
            node_filesystem_avail_bytes{device="/dev/mapper/hoardvg-backuplv",mountpoint="/mnt/backups"}
            / node_filesystem_size_bytes{device="/dev/mapper/hoardvg-backuplv",mountpoint="/mnt/backups"} < 0.10
          for: 10m
          labels:
            severity: critical
          annotations:
            description: Less than 10 percent of the direct backup filesystem is available on minis.
            summary: Backup filesystem is nearly full
        - alert: BulkStorageMountSetIncomplete
          expr: |
            absent(node_filesystem_size_bytes{device="/dev/mapper/hoardvg-medialv",fstype="ext4",mountpoint="/mnt/media"})
            or absent(node_filesystem_size_bytes{device="/dev/mapper/hoardvg-games",fstype="ext4",mountpoint="/mnt/games"})
            or absent(node_filesystem_size_bytes{device="/dev/mapper/hoardvg-frigate",fstype="ext4",mountpoint="/mnt/frigate"})
            or absent(node_filesystem_size_bytes{device="/dev/mapper/hoardvg-backuplv",fstype="ext4",mountpoint="/mnt/backups"})
          for: 5m
          labels:
            severity: critical
          annotations:
            description: One or more expected direct-attached LVM/ext4 mounts is missing or mapped to the wrong device.
            summary: Expected bulk-storage mount is missing
        - alert: BulkStorageFilesystemDeviceError
          expr: node_filesystem_device_error{device=~"/dev/mapper/hoardvg-(medialv|games|frigate|backuplv)",fstype="ext4",mountpoint=~"/mnt/(media|games|frigate|backups)"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            description: "node-exporter cannot read the direct-attached filesystem mounted at {{ $labels.mountpoint }}."
            summary: Bulk-storage filesystem reports a device error
        - alert: VaultLocked
          expr: |
            absent(node_filesystem_size_bytes{device="/dev/mapper/vault",fstype="ext4",mountpoint="/mnt/vault"})
            and on() (homelab_backup_repository_enrolled{dataset="vault",destination="nas"} == 1)
          for: 30m
          labels:
            severity: warning
          annotations:
            description: The encrypted vault has remained locked for 30 minutes; ingestion and vault protection are paused.
            summary: Encrypted vault is locked
        - alert: VaultFilesystemDeviceError
          expr: node_filesystem_device_error{device="/dev/mapper/vault",fstype="ext4",mountpoint="/mnt/vault"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            description: node-exporter cannot read the mounted encrypted vault filesystem.
            summary: Vault filesystem reports a device error
        - alert: RaidCheckStalled
          expr: |
            node_md_state{device="md3",state="check"} == 1
            and on(instance, device)
            changes(node_md_blocks_synced{device="md3"}[30m]) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            description: The md3 consistency check has made no block progress for at least 45 minutes.
            summary: RAID consistency check is stalled
        - alert: GluetunRestarted
          expr: increase(kube_pod_container_status_restarts_total{namespace="media",container="gluetun"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            description: Gluetun restarted in the last 15 minutes; verify the VPN tunnel and kill switch.
            summary: Download VPN container restarted
