apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
  namespace: flux-system
spec:
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 11.15.1
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: prometheus-blackbox-exporter
  targetNamespace: monitoring
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            follow_redirects: true
            preferred_ip_protocol: ip4
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
        tcp_connect:
          prober: tcp
          timeout: 5s
    fullnameOverride: blackbox-exporter
    priorityClassName: homelab-standard
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    serviceMonitor:
      selfMonitor:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
