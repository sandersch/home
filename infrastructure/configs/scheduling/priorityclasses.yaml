apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-critical
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Critical homelab workloads favored for scheduling and preemption under resource pressure.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-standard
value: 1000
globalDefault: false
description: Standard homelab workloads that can yield to critical services.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-low
value: 100
globalDefault: false
description: Low-priority jobs such as backups; container requests/limits determine their QoS class.
