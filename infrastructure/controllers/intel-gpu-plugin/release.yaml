apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu-plugin
  namespace: flux-system
spec:
  interval: 30m
  path: ./deployments/gpu_plugin
  patches:
    - patch: |
        - op: add
          path: /spec/template/spec/containers/0/args
          value:
            - -shared-dev-num=2
      target:
        group: apps
        version: v1
        kind: DaemonSet
        name: intel-gpu-plugin
  prune: true
  sourceRef:
    kind: GitRepository
    name: intel-device-plugins
  targetNamespace: intel-gpu-plugin
  wait: true
