apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: topolvm
  namespace: flux-system
spec:
  chart:
    spec:
      chart: topolvm
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: topolvm
      version: 16.1.1
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: topolvm
  targetNamespace: topolvm-system
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      affinity: ""
      podDisruptionBudget:
        enabled: false
      replicaCount: 1
    lvmd:
      managed: false
      deviceClasses:
        - name: scratch
          volume-group: vg0
          default: true
          spare-gb: 150
    node:
      lvmdEmbedded: true
      kubeletWorkDirectory: /var/lib/kubelet
