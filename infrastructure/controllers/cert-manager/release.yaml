apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: jetstack
      version: v1.20.3
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
