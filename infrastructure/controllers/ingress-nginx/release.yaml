apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ingress-nginx
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      version: 4.15.1
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: ingress-nginx
  targetNamespace: ingress-nginx
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      ingressClassResource:
        default: true
      service:
        externalTrafficPolicy: Local
        loadBalancerIP: 10.137.20.10
        type: LoadBalancer
