apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  chart:
    spec:
      chart: metallb
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: metallb
      version: 0.16.1
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: metallb
  targetNamespace: metallb-system
  upgrade:
    remediation:
      retries: 3
